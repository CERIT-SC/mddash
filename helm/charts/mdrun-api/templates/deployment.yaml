apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdrun-api
  labels:
    app: mdrun-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mdrun-api
  template:
    metadata:
      labels:
        app: mdrun-api
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mdrun-api
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PVC_NAME
          value: "mdrun-api-data"
        - name: GUNICORN_WORKERS
          value: "{{ .Values.gunicorn.workers }}"
        - name: GUNICORN_THREADS
          value: "{{ .Values.gunicorn.threads }}"
        - name: TZ
          value: "UTC"
        {{- if .Values.env }}
        {{- toYaml .Values.env | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
      - name: poller
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["python", "-m", "polling"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PVC_NAME
          value: "mdrun-api-data"
        - name: POLL_INTERVAL_SECONDS
          value: "{{ .Values.polling.intervalSeconds }}"
        - name: TZ
          value: "UTC"
        {{- if .Values.env }}
        {{- toYaml .Values.env | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.polling.resources | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mdrun-api-data
