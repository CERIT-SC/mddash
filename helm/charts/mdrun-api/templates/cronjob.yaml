apiVersion: batch/v1
kind: CronJob
metadata:
  name: mdrun-api-poller
  labels:
    app: mdrun-api-poller
spec:
  schedule: {{ .Values.polling.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.polling.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.polling.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.polling.backoffLimit }}
      template:
        metadata:
          labels:
            app: mdrun-api-poller
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.polling.sameNodeAsApi }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: mdrun-api
                  topologyKey: kubernetes.io/hostname
          {{- end }}
          containers:
          - name: poller
            image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["python", "-m", "polling"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PVC_NAME
              value: "mdrun-api-data"
            - name: TZ
              value: "UTC"
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            volumeMounts:
            - name: data
              mountPath: /data
            resources:
              {{- toYaml .Values.polling.resources | nindent 14 }}
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: mdrun-api-data
