apiVersion: v1
kind: Service
metadata:
  name: mdrun-api
  labels:
    app: mdrun-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
  {{- if .Values.metrics.enabled }}
  - name: metrics
    port: {{ .Values.metrics.port }}
    targetPort: metrics
    protocol: TCP
  {{- end }}
  selector:
    app: mdrun-api
