replicaCount: 1

image:
  repository: mdrun-api
  tag: "latest"
  pullPolicy: Never

service:
  port: 80
  targetPort: 5000

storage:
  size: 5Gi

gunicorn:
  workers: 2
  threads: 4

polling:
  schedule: "*/15 * * * *"
  sameNodeAsApi: true
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 30

# you should provide the S3_CREDENTIALS and S3_ENDPOINT via env
env: []
