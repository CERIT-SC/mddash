apiVersion: v2
name: mddash-jupyterhub
description: A Helm chart for JupyterHub with MDDash
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  # Keep in lockstep with the k8s-hub base image tag in hub/Dockerfile.
  - name: jupyterhub
    version: "4.4.2"
    repository: "https://hub.jupyter.org/helm-chart/"
  - name: mdrun-api
    version: "0.1.0"
    repository: "file://../mdrun-api"
  - name: tuner
    version: "0.1.0"
    repository: "file://../tuner"
  - name: seaweedfs
    version: "4.47.0"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
