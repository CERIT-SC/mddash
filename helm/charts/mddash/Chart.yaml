apiVersion: v2
name: mddash-jupyterhub
description: A Helm chart for JupyterHub with MDDash
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  # Keep in lockstep with the k8s-hub base image tag in hub/Dockerfile.
  - name: jupyterhub
    version: "4.4.2"
    repository: "https://hub.jupyter.org/helm-chart/"
  - name: mdrun-api
    version: "0.1.0"
    repository: "file://../mdrun-api"
  - name: tuner
    version: "0.1.0"
    repository: "file://../tuner"
  - name: seaweedfs
    version: "4.47.0"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
  - name: prometheus
    version: "29.37.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  # The grafana/helm-charts copy of this chart is deprecated.
  - name: grafana
    version: "14.0.1"
    repository: "https://grafana-community.github.io/helm-charts"
    condition: grafana.enabled
