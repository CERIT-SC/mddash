apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-landing
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-landing
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-landing
    spec:
      containers:
        - name: landing
          image: "{{ .Values.landing.image.repository }}:{{ .Values.landing.image.tag }}"
          imagePullPolicy: {{ .Values.landing.image.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: {{ .Values.landing.resources.requests.cpu | quote }}
              memory: {{ .Values.landing.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.landing.resources.limits.cpu | quote }}
              memory: {{ .Values.landing.resources.limits.memory | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-landing
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-landing
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-landing
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - {{ .Values.landing.hostname }}
      secretName: {{ .Values.landing.tlsSecretName }}
  rules:
    - host: {{ .Values.landing.hostname }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-landing
                port:
                  number: 80
