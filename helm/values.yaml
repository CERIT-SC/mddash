jupyterhub:
  hub:
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      DummyAuthenticator:
        password: "admin"
      KubeSpawner:
        enable_user_namespaces: true
        user_namespace_template: "user-{username}"
        services_enabled: true

  singleuser:
    image:
      name: mddash
      tag: "dev"
      pullPolicy: Never # TEMPORARY (delete when the image is in a registry)

    # Default URL to redirect after spawn
    defaultUrl: "/dash"

    # Resource limits
    memory:
      guarantee: 4G
      limit: 16G
    cpu:
      guarantee: 0.2
      limit: 1

    # User PVC configuration
    storage:
      capacity: 10Gi
      homeMountPath: /mddash

    extraEnv:
      POD_NAMESPACE:
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      NOTEBOOK_IMAGE:
        value: "cerit.io/ljocha/mddash-notebook"

    # Increased timeout for custom image startup
    startTimeout: 600

  proxy:
    secretToken: "your-secret-token-here-change-me"

  # TEMPORARY Disable image pre-puller since we're using local images
  prePuller:
    continuous:
      enabled: false

  ingress:
    enabled: false

gromacs-tuner:
  image:
    repository: cerit.io/xkrasa/gromacs-tuner-api
    tag: "1.2"
    pullPolicy: Never  # TEMPORARY (delete when the image is in a registry)

  ray:
    version: "2.42.1"
    image: "cerit.io/adamondrejka/gmx-cuda-ray-2-42-1-with-user"

  auth:
    user: "admin"
    password: "strong-secret-here"

  storage:
    storageClassName: "standard"

  ingress:
    enabled: false
