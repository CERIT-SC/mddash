jupyterhub:
  hub:
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      DummyAuthenticator:
        password: "admin"
      KubeSpawner:
        services_enabled: true
    extraEnv:
      RANCHER_PROJECT_ID:
        value: "c-m-qvndqhf6:p-hshk2"  # Set the Rancher project ID for namespace annotation
    extraVolumes:
      - name: kubeconfig
        secret:
          secretName: mddash-kubeconfig-secret
    extraVolumeMounts:
      - name: kubeconfig
        mountPath: /home/jovyan/.kube
        readOnly: true

  singleuser:
    image:
      name: "cerit.io/xkrasa/mddash"
      tag: "dev"
      pullPolicy: Always  # TODO: change to `ifNotPresent` once the image is stable

    # Default URL to redirect after spawn
    defaultUrl: "/dash"

    # Resource limits
    memory:
      guarantee: 4G
      limit: 16G
    cpu:
      guarantee: 0.2
      limit: 1

    # Increased timeout for custom image startup
    startTimeout: 600

    # Use PVC created by pre_spawn_hook.py
    storage:
      type: static
      homeMountPath: /mddash
      static:
        pvcName: claim-{username}

    uid: 1000
    fsGid: 100
    extraEnv:
      POD_NAMESPACE:
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      NOTEBOOK_IMAGE:
        value: "cerit.io/xkrasa/mddash-notebook"

    extraPodConfig:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    cloudMetadata:
      blockWithIptables: false

  proxy:
    secretToken: "your-secret-token-here-change-me"

  # TODO: Requires cluster-wide permissions to be enabled
  scheduling:
    userScheduler:
      enabled: false

  prePuller:
    continuous:
      enabled: false
    # disabled because it was exceeding resource limit and preventing the chart from installing
    hook:
      enabled: false

  ingress:
    enabled: true
    hosts:
      - mddash.dyn.cloud.e-infra.cz
    tls:
      - hosts:
          - mddash.dyn.cloud.e-infra.cz
        secretName: mddash-dyn-cloud-e-infra-cz-tls

