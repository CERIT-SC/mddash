jupyterhub:
  # Disable all NetworkPolicies globally
  global:
    networkPolicy:
      enabled: false

  hub:
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      DummyAuthenticator:
        password: "admin"
      KubeSpawner:
        enable_user_namespaces: true
        user_namespace_template: "user-{username}"
        # Configure explicit service-based communication
        services_enabled: true
        # Use internal cluster IPs and let Kubernetes handle service discovery
        internal_ssl: false

    # Disable NetworkPolicy to allow cross-namespace communication
    networkPolicy:
      enabled: false

  singleuser:
    # Your custom MD Dashboard image
    image:
      name: mddash
      tag: "dev"
      pullPolicy: Never # TEMPORARY (delete when the image is in a registry)

    # Default URL to your dashboard
    defaultUrl: "/dash"

    # Security context from your deployment
    uid: 1000
    fsGid: 1000
    allowPrivilegeEscalation: false

    # Disable NetworkPolicy to allow cross-namespace communication
    networkPolicy:
      enabled: false

    # Resource limits from your deployment
    memory:
      guarantee: 4G
      limit: 16G
    cpu:
      guarantee: 0.2
      limit: 1

    # Mount user home to /mddash instead of default /home/jovyan
    storage:
      capacity: 10Gi
      homeMountPath: /mddash

    extraEnv:
      POD_NAMESPACE:
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      NOTEBOOK_IMAGE:
        value: "cerit.io/ljocha/mddash-notebook"
      JUPYTERHUB_API_URL: "http://hub.fida-ns.svc.cluster.local:8081/hub/api"
      JUPYTERHUB_ACTIVITY_URL: "http://hub.fida-ns.svc.cluster.local:8081/hub/api/users/admin/activity"

    # Increased timeout for custom image startup
    startTimeout: 600

  proxy:
    secretToken: "your-secret-token-here-change-me"

  # TEMPORARY Disable image pre-puller since we're using local images
  prePuller:
    continuous:
      enabled: false

  ingress:
    enabled: false

gromacs-tuner:
  image:
    repository: cerit.io/xkrasa/gromacs-tuner-api
    tag: "1.2"
    pullPolicy: Never  # TEMPORARY (delete when the image is in a registry)

  ray:
    version: "2.42.1"
    image: "cerit.io/adamondrejka/gmx-cuda-ray-2-42-1-with-user"

  auth:
    user: "admin"
    password: "strong-secret-here"

  storage:
    storageClassName: "standard"

  ingress:
    enabled: false
