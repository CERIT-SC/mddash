# Apply this file manually as a cluster admin before deploying the helm chart:
#   kubectl apply -f helm/rbac/clusterrole.yaml
#
# This grants the JupyterHub hub service account the permissions it needs to
# create per-user namespaces, RBAC, and PVCs at spawn time.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mddash-hub
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    # get/list/watch: KubeSpawner reflector tracks pod state across all user namespaces
    # deletecollection: post_stop_hook bulk-deletes pods on server stop
    verbs: ["get", "list", "watch", "deletecollection"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    # escalate: create roles with permissions the hub doesn't hold
    # bind: create rolebindings referencing those roles without holding all their permissions
    verbs: ["create", "get", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get"]
