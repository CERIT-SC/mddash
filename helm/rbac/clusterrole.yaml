# Apply this file manually as a cluster admin before deploying the helm chart:
#   kubectl apply -f helm/rbac/clusterrole.yaml
#
# This grants the JupyterHub hub service account the permissions it needs to
# create per-user namespaces, RBAC, and PVCs at spawn time.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mddash-hub
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    # deletecollection is required for delete_collection_namespaced_pod (post_stop_hook)
    verbs: ["get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    # escalate: create roles with permissions the hub doesn't hold
    # bind: create rolebindings referencing those roles without holding all their permissions
    verbs: ["create", "get", "list", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get", "list"]
