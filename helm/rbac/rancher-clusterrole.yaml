# Rancher-specific — only required on Rancher-managed clusters.
# The pre_spawn_hook annotates each user namespace with field.cattle.io/projectId to place it
# in the correct Rancher project. manage-namespaces on management.cattle.io/projects is the
# non-standard Rancher verb that allows this. resourceNames scopes it to one project.
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: project-<PROJECT_ID>-manage-ns-cluster-role
rules:
  - apiGroups: ["management.cattle.io"]
    resources: ["projects"]
    resourceNames: ["p-<PROJECT_ID>"]
    verbs: ["manage-namespaces"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: project-<PROJECT_ID>-manage-ns-role-binding
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: <NAMESPACE>
roleRef:
  kind: ClusterRole
  name: project-<PROJECT_ID>-manage-ns-cluster-role
  apiGroup: rbac.authorization.k8s.io
