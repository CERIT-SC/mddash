# Apply this file manually as a cluster admin before deploying the helm chart:
#   kubectl apply -f helm/rbac/clusterrolebinding.yaml
#
# Binds the mddash-hub ClusterRole to the JupyterHub hub service account.
# Update the namespace below to match your deployment namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mddash-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mddash-hub
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: mddash  # update if deploying to a different namespace
