apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mddash-user-binding
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: mddash-user
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: mddash-user-role
  apiGroup: rbac.authorization.k8s.io
