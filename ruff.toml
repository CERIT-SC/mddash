target-version = "py313"
line-length = 120
preview = true  # required for DOC (pydoclint) rules
extend-exclude = ["scripts", "docs", ".worktrees"]


# Docs: https://docs.astral.sh/ruff/rules/
[lint]
select = [
    "I",    # isort — enforces consistent import ordering and grouping
    "D",    # pydocstyle — docstring presence and formatting (see ignores below for style choices)
    "F",    # Pyflakes — undefined names, unused imports/variables, syntax errors
    "G",    # flake8-logging-format — discourages eager string formatting in log calls (use lazy % args)
    "N",    # pep8-naming — class/function/variable naming conventions (PascalCase, snake_case, etc.)
    "PL",    # Pylint — broad static analysis: complexity, refactoring hints, error-prone patterns
    "PT",    # flake8-pytest-style — enforces pytest idioms (fixture scope, assert style, raises usage)
    "TC",    # flake8-type-checking — moves pure type-annotation imports into TYPE_CHECKING blocks
    "C4",    # flake8-comprehensions — prefers comprehensions/generators over map()/filter()/list() calls
    "ANN",    # flake8-annotations — requires type annotations on function signatures
    "DOC",    # pydoclint — validates docstring contents match actual function signature (args, returns)
    "LOG",    # flake8-logging — detects incorrect logging API usage (e.g. calling logging.warn)
    "RSE",    # flake8-raise — enforces `raise X` over `raise X()` for bare exception re-raises
    "RET",    # flake8-return — flags unnecessary else/elif after return, missing explicit return values
    "ICN",    # flake8-import-conventions — enforces conventional aliases (e.g. `import numpy as np`)
    "SIM",    # flake8-simplify — suggests simpler equivalents (e.g. `if x == True` → `if x`)
    "SLF",    # flake8-self — flags access to private members (`_attr`) from outside the class
    "ARG",    # flake8-unused-arguments — warns on function arguments that are never used
    "PTH",    # flake8-use-pathlib — prefers pathlib.Path over os.path string manipulation
    "RUF",    # Ruff-specific — miscellaneous rules unique to Ruff (ambiguous chars, mutable defaults, etc.)
    "ASYNC",    # flake8-async — detects blocking calls (sleep, open, subprocess) inside async functions
]
ignore = [
    "missing-blank-line-after-last-section",    # prefer compact docstrings
    "multi-line-summary-first-line",    # use D213 style: summary on first line
    "undocumented-public-module",    # too noisy for service code
    "undocumented-public-package",    # too noisy for service code
    "undocumented-magic-method",    # docstrings on __str__, __dict__, etc. add noise without value
    "incorrect-blank-line-before-class",    # conflicts with D211
    "logging-f-string",    # prefer readability over lazy evaluation
    "too-many-arguments",    # Flask view functions and constructors often need many params
    "too-many-statements",    # complex route handlers shouldn't be force-split artificially
    "too-many-return-statements",    # guard clauses produce many early returns by design
    "too-many-positional-arguments",    # Flask view functions often have many path/query parameters
    "no-self-use",    # keep instance methods for consistent API surface and mock-ability in tests
    "too-many-statements-in-try-clause",    # complex handlers shouldn't be force-split artificially
    "undocumented-public-function",    # test functions don't need docstrings, descriptive names suffice
    "docstring-missing-returns",    # Returns: sections restate type annotations — one-line docstrings suffice
    "docstring-missing-exception",    # Raises: sections restate raise statements — one-line docstrings suffice
]

[lint.per-file-ignores]
# Test files — mock-injected params, inline imports, and magic values are idiomatic
"**/tests/**" = [
    "ARG",    # mock decorators inject params that tests don't reference
    "ANN",    # pytest fixtures and mock decorators provide dynamic arguments
    "undocumented-public-class",    # test classes are documented by descriptive names
    "undocumented-public-method",    # test methods are documented by descriptive names
    "DOC",    # test functions don't need docstring content validation
    "import-private-name",    # tests validate private helpers directly
    "float-equality-comparison",    # exact parsed benchmark values are deterministic
    "invalid-function-name",    # test names preserve case-sensitive command-line flags
    "compare-to-empty-string",    # explicit empty-string comparisons are clearer in assertions
    "PTH",    # os.path is fine in test fixtures
    "magic-value-comparison",    # literal values in assertions are clearer than constants
    "compare-to-empty-string",    # `== ""` reads better than `not` in assertions
    "float-equality-comparison",    # exact parsed benchmark values are deterministic
    "import-private-name",    # tests validate private parsing helpers directly
    "typing-only-standard-library-import",    # inline imports in tests are intentional
    "too-many-arguments",    # mock decorators inflate parameter counts
    "private-member-access",    # tests routinely access private members
    "import-outside-top-level",    # deferred imports avoid import-order side effects in tests
]
