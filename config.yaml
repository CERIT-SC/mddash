# Production environment configuration

# Kubernetes namespace
namespace: md-dashboard-ns

# Rancher project ID for user namespace annotation
rancherProjectId: "c-m-qvndqhf6:p-hshk2"

# Global storage class for all persistent volumes
storageClassName: nfs-csi

# Container and helm chart registry
registry: cerit.io/xkrasa

# Dashboard hostname
dashboard:
  hostname: mddash.dyn.cloud.e-infra.cz

# MDRepo integration for publishing experiments
mdrepo:
  url: https://workflow-repo.test.du.cesnet.cz
  scopes: user:email

# Notebook image (spawned by Dashboard pod)
notebook:
  image: cerit.io/xkrasa/mddash-notebook
  platform: linux/amd64
  tag: latest

# Sidecar container images for user pod
sidecars:
  platform: linux/amd64
  tag: latest
  pullPolicy: IfNotPresent
  ui:
    image: cerit.io/xkrasa/mddash-ui
  proxy:
    image: cerit.io/xkrasa/mddash-proxy
  auth:
    image: cerit.io/xkrasa/mddash-auth
  api:
    image: cerit.io/xkrasa/mddash-api
  s3sync:
    image: cerit.io/xkrasa/mddash-s3sync

# MinIO object storage tenant
minio:
  servers: 2
  volumesPerServer: 2
  poolSize: 100Gi  # Storage pool size

resources:
  singleuser:
    memory:
      guarantee: 512M
      limit: 4G
    cpu:
      guarantee: 0.2
      limit: 1
  namespaceQuota:
    requestsCpu: "2000m"
    requestsMemory: "8Gi"
    limitsCpu: "64000m"
    limitsMemory: "256Gi"
  pvcStorageSize: 100Gi

helm:
  package: mddash

# mdrun-api service
mdrunApi:
  image: cerit.io/xkrasa/mdrun-api
  platform: linux/amd64
  tag: latest
  storage:  # Persistent storage for mdrun-api database
    size: 20Gi

# Gromacs Tuner service
gromacsTuner:
  image:
    repository: cerit.io/adamondrejka/gromacs-tuner-api
    tag: "1.2"
  storage:
    size: 2Gi
  api:
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
      requests:
        cpu: "0.5"
        memory: "1Gi"
  ray:
    image: "cerit.io/adamondrejka/gmx-cuda-ray-2-42-1-with-user"
    head:
      resources:
        limits:
          cpu: "1"
          memory: "8Gi"
        requests:
          cpu: "500m"
          memory: "4Gi"
    worker:
      replicas: 1
      gpuProduct: "NVIDIA-A40"
      resources:
        limits:
          cpu: "32"
          memory: "128Gi"
          nvidia.com/gpu: "1"
        requests:
          cpu: "32"
          memory: "16Gi"
          nvidia.com/gpu: "1"
