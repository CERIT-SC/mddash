# Production environment configuration

# Kubernetes namespace
namespace: md-dashboard-ns

# Rancher project ID for user namespace annotation
rancherProjectId: "c-m-qvndqhf6:p-hshk2"

# Global storage class for all persistent volumes
storageClassName: nfs-csi

# Container image registry. Helm charts are pushed under its /charts path.
registry: cerit.io/mddash
imageTag: latest  # Overridden by CI/CD or make deploy, see README.md

# Dashboard hostname
dashboard:
  hostname: mddash.dyn.cloud.e-infra.cz

# OIDC provider for JupyterHub authentication
oidc:
  authenticator_class: "generic-oauth"
  oauth_server: "login.e-infra.cz"
  loginService: "e-INFRA CZ"  # the button label in UI
  authorizePath: oidc/authorize
  tokenPath: oidc/token
  userdataPath: oidc/userinfo
  usernameKey: preferred_username
  allowAll: true
  scope:
    - openid
    - profile
    - email

# MDRepo integration for publishing experiments
mdrepo:
  url: https://workflow-repo.test.du.cesnet.cz
  scopes: user:email

# MDPosit integration for publishing experiments
mdposit:
  url: https://mdrepo.eu/

# MetaDump API for extracting GROMACS TPR metadata before publishing
metadump:
  url: "https://gmd.ceitec.cz"

# Default notebooks repository (setup and analysis notebooks)
defaultNotebooksRepo: https://github.com/sb-ncbr/mddash-notebooks.git

# Notebook image (spawned by Dashboard pod)
notebook:
  image: mddash-notebook
  platform: linux/amd64

# MD analysis image used for on-demand analysis K8s jobs
analysis:
  image: cerit.io/mddash/mddb_wf:0.1.11-gmx2026

# GPU resource type used by mdrun-api jobs and gromacs-tuner workers
gpuType: "nvidia.com/mig-1g.10gb"

# Container images used for mdrun-api simulation jobs
gmxImage: "cerit.io/mddash/gromacs-tuner-worker:gmx-2026.1_amber-26_ray-2.54.0_py-3.13"
amberImage: "cerit.io/mddash/amber:24"

# Landing page image (served at / on the dashboard hostname)
landing:
  image: mddash-landing

# Sidecar container images for user pod
sidecars:
  platform: linux/amd64
  pullPolicy: IfNotPresent
  ui:
    image: mddash-ui
  proxy:
    image: mddash-proxy
  auth:
    image: mddash-auth
  api:
    image: mddash-api
  s3sync:
    image: mddash-s3sync
  mdrepoUploader:
    image: mddash-mdrepo-uploader

# S3 object storage configuration
s3:
  endpoint: https://s3.cl4.du.cesnet.cz

resources:
  singleuser:
    memory:
      guarantee: 512M
      limit: 4G
    cpu:
      guarantee: 0.2
      limit: 1
  notebookQuota:
    # Max concurrent notebook pods per user namespace
    maxConcurrent: 1
  notebook:
    # Idle timeout in seconds: kernels are culled and the server shuts down after this period
    idleTimeoutSeconds: 3600
    # jupyter container — limits allow burst above scheduling baseline
    cpuRequest: "500m"
    memoryRequest: "1Gi"
    cpuLimit: "5000m"    # 10× request: interactive, prefer throttle over kill
    memoryLimit: "8Gi"   # 8× request: burst headroom for in-memory analysis

  analysisJob:
    # Dashboard mwf analysis jobs are mostly single-threaded; extra CPU limit rarely speeds them up.
    cpuRequest: "1000m"
    memoryRequest: "2Gi"
    cpuLimit: "1000m"
    memoryLimit: "8Gi"
  namespaceQuota:
    # requests = expected simultaneous usage; formula: see docs/resource-management.md
    requestsCpu: "4000m"
    requestsMemory: "8Gi"
    # limits = sum of all container limits at full load (1 notebook at 4x tier)
    limitsCpu: "42000m"
    limitsMemory: "80Gi"
  pvcStorageSize: 100Gi

hub:
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

helm:
  package: mddash

# mdrun-api service
mdrunApi:
  image: mdrun-api
  platform: linux/amd64
  storage:  # Persistent storage for mdrun-api database
    size: 20Gi
    # SQLite WAL needs a block-device-backed filesystem, not NFS.
    storageClassName: csi-ceph-rbd-du
  gunicorn:
    workers: 2
    threads: 4
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  polling:
    resources:
      limits:
        cpu: "250m"
        memory: "256Mi"
      requests:
        cpu: "50m"
        memory: "128Mi"
  jobHeadroom:
    # Maximum number of HPC jobs running simultaneously in the hub namespace.
    # Set cpuPerJob/memoryPerJob to the largest single job you want to allow.
    maxConcurrentJobs: 1  # TODO: increase when more resources are available
    cpuPerJob: "16"
    memoryPerJob: "32Gi"

# Gromacs Tuner service
gromacsTuner:
  image:
    repository: cerit.io/mddash/gromacs-tuner-api
    tag: "latest"  # TODO: lock version
    pullPolicy: Always
  storage:
    size: 100Gi
  api:
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
      requests:
        cpu: "0.5"
        memory: "1Gi"
  ray:
    image: "cerit.io/mddash/gromacs-tuner-worker:gmx-2026.1_amber-26_ray-2.54.0_py-3.13"
    head:
      resources:
        limits:
          cpu: "1"
          memory: "8Gi"
        requests:
          cpu: "500m"
          memory: "4Gi"
    worker:
      maxReplicas: 1  # TODO: increase to 3 when more resources are available
      idleTimeoutSeconds: 3600
      resources:
        limits:
          cpu: "8"  # TODO: ask for more (should be at least 32)
          memory: "64Gi"
          nvidia.com/mig-1g.10gb: "1"
        requests:
          cpu: "8"  # should be same as limit
          memory: "16Gi"
          nvidia.com/mig-1g.10gb: "1"
