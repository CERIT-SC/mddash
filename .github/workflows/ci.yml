name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Enable Corepack
        run: corepack enable
      - name: Install ruff
        run: uv tool install ruff
      - name: Install dashboard UI dependencies
        run: corepack pnpm install --frozen-lockfile
        working-directory: dashboard/ui
      - name: Install landing dependencies
        run: corepack pnpm install --frozen-lockfile
        working-directory: landing
      - name: Check formatting
        run: make format-check
      - name: Check linting
        run: make lint

  test-dashboard-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run pytest

  test-dashboard-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/auth
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run pytest

  test-mdrun-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdrun-api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev --no-install-project
      - run: uv run pytest

  test-pre-spawn-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run --group dev pytest helm/charts/mddash/tests/

  type-check-dashboard-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run ty check .

  type-check-dashboard-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/auth
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run ty check .

  type-check-mdrun-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdrun-api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev --no-install-project
      - run: uv run ty check .

  type-check-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Enable Corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: dashboard/ui
      - run: corepack pnpm run type-check
        working-directory: dashboard/ui

  type-check-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Enable Corepack
        run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: landing
      - run: corepack pnpm run type-check
        working-directory: landing
