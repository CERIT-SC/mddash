name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-py:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install ruff
        run: uv tool install ruff
      - name: Check formatting and linting
        run: make format-check-py lint-py

  frontend-static:
    timeout-minutes: 10
    name: Frontend static checks
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-frontend
      - name: Check formatting and linting
        run: make format-check-ui lint-ui
      - name: Type-check frontend workspace
        run: pnpm run type-check
      - name: Check frontend dead code
        run: pnpm run knip
      - name: Check Dashboard API client drift
        run: pnpm run generated:check

  frontend-test:
    timeout-minutes: 10
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-frontend
      - name: Test Dashboard UI
        run: pnpm run test:ui

  frontend-build:
    timeout-minutes: 10
    name: Frontend builds
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-frontend
      - name: Build frontend packages
        run: pnpm --parallel --filter dash --filter landing --filter hub-ui build

  # Name-stable join point so branch protection and callers see one result.
  frontend-checks:
    timeout-minutes: 5
    name: Frontend checks
    needs: [frontend-static, frontend-test, frontend-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all frontend jobs to pass
        env:
          STATIC: ${{ needs.frontend-static.result }}
          TEST: ${{ needs.frontend-test.result }}
          BUILD: ${{ needs.frontend-build.result }}
        run: |
          for result in "$STATIC" "$TEST" "$BUILD"; do
            [ "$result" = "success" ] || { echo "::error::Frontend job did not succeed: $result"; exit 1; }
          done

  check-dashboard-api:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ty check .

  check-dashboard-auth:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/auth
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ty check .

  check-mdrun-api:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdrun-api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev --no-install-project
      - run: uv run pytest
      - run: uv run ty check .

  check-tuner:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tuner
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev --no-install-project
      - run: uv run pytest
      - run: uv run ty check api

  test-pre-spawn-hook:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev
      - run: uv run --group dev pytest helm/charts/mddash/tests/

  validate-charts:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install gomplate
        run: |
          curl -sSL -o /usr/local/bin/gomplate \
            https://github.com/hairyhenderson/gomplate/releases/download/v5.2.0/gomplate_linux-amd64
          chmod +x /usr/local/bin/gomplate
      - name: Install Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
      - name: Lint and template charts
        run: make validate-charts

  validate-workflows:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | \
            sudo tar -xzf - -C /usr/local/bin actionlint
      - name: Install zizmor
        run: uv tool install zizmor
      - name: Validate workflow syntax
        run: actionlint
      - name: Security analysis
        run: zizmor --min-severity high .
