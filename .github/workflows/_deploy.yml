name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-version:
        required: true
        type: string
      config-file:
        required: true
        type: string
      release-mode:
        required: true
        type: boolean
      git-ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.config.outputs.registry }}
      registry-host: ${{ steps.config.outputs.registry-host }}
      namespace: ${{ steps.config.outputs.namespace }}
      package: ${{ steps.config.outputs.package }}
      hostname: ${{ steps.config.outputs.hostname }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false
      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Read config
        id: config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          {
            echo "registry=$(yq '.registry' "$CONFIG_FILE")"
            echo "registry-host=$(yq '.registry' "$CONFIG_FILE" | cut -d'/' -f1)"
            echo "namespace=$(yq '.namespace' "$CONFIG_FILE")"
            echo "package=$(yq '.helm.package' "$CONFIG_FILE")"
            echo "hostname=$(yq '.dashboard.hostname' "$CONFIG_FILE")"
          } >> "$GITHUB_OUTPUT"

  build-sidecars:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            context: .
            dockerfile: dashboard/ui/Dockerfile
            image-suffix: mddash-ui
          - name: auth
            context: .
            dockerfile: dashboard/auth/Dockerfile
            image-suffix: mddash-auth
          - name: api
            context: .
            dockerfile: dashboard/api/Dockerfile
            image-suffix: mddash-api
          - name: s3sync
            context: dashboard
            dockerfile: dashboard/s3-sync/Dockerfile
            image-suffix: mddash-s3sync
          - name: mdrepo-uploader
            context: dashboard
            dockerfile: dashboard/mdrepo-uploader/Dockerfile
            image-suffix: mddash-mdrepo-uploader
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ needs.setup.outputs.registry-host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Compute image reference
        id: image
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          IMAGE_SUFFIX: ${{ matrix.image-suffix }}
        run: |
          echo "base=$REGISTRY/$IMAGE_SUFFIX" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.base }}
          tags: |
            type=raw,value=${{ inputs.image-version }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.base }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.base }}:buildcache,mode=max

  build-proxy:
    needs: [setup, build-sidecars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ needs.setup.outputs.registry-host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Compute image reference
        id: image
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          IMAGE_VERSION: ${{ inputs.image-version }}
        run: |
          echo "base=$REGISTRY/mddash-proxy" >> "$GITHUB_OUTPUT"
          echo "ui=$REGISTRY/mddash-ui:$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.base }}
          tags: |
            type=raw,value=${{ inputs.image-version }}
      - name: Build and push proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: dashboard/proxy
          file: dashboard/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UI_IMAGE=${{ steps.image.outputs.ui }}
          cache-from: type=registry,ref=${{ steps.image.outputs.base }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.base }}:buildcache,mode=max

  build-components:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: notebook
            context: notebook
            dockerfile: notebook/Dockerfile
            image-suffix: mddash-notebook
          - name: mdrun-api
            context: .
            dockerfile: mdrun-api/Dockerfile
            image-suffix: mdrun-api
          - name: tuner-api
            context: .
            dockerfile: tuner/Dockerfile
            image-suffix: tuner-api
          - name: landing
            context: .
            dockerfile: landing/Dockerfile
            image-suffix: mddash-landing
          - name: hub
            context: .
            dockerfile: hub/Dockerfile
            image-suffix: mddash-hub
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ needs.setup.outputs.registry-host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Compute image reference
        id: image
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          IMAGE_SUFFIX: ${{ matrix.image-suffix }}
        run: |
          echo "base=$REGISTRY/$IMAGE_SUFFIX" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.base }}
          tags: |
            type=raw,value=${{ inputs.image-version }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.base }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.base }}:buildcache,mode=max

  push-charts:
    if: ${{ inputs.release-mode }}
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false
      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Install Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
      - name: Login to registry
        env:
          REGISTRY_HOST: ${{ needs.setup.outputs.registry-host }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login "$REGISTRY_HOST" \
            --username "$REGISTRY_USERNAME" \
            --password-stdin
      - name: Package and push charts
        env:
          ENV: ${{ inputs.environment }}
          IMAGE_VERSION: ${{ inputs.image-version }}
        run: make push-mddash-chart ENV="$ENV" IMAGE_TAG="$IMAGE_VERSION"

  deploy:
    needs: [setup, build-sidecars, build-proxy, build-components, push-charts]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.build-sidecars.result == 'success' &&
      needs.build-proxy.result == 'success' &&
      needs.build-components.result == 'success' &&
      (needs.push-charts.result == 'success' || needs.push-charts.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false
      - name: Install yq and gomplate
        run: |
          curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          curl -sSL -o /usr/local/bin/gomplate \
            https://github.com/hairyhenderson/gomplate/releases/download/v5.2.0/gomplate_linux-amd64
          chmod +x /usr/local/bin/yq /usr/local/bin/gomplate
      - name: Install Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
      - name: Login to registry
        env:
          REGISTRY_HOST: ${{ needs.setup.outputs.registry-host }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login "$REGISTRY_HOST" \
            --username "$REGISTRY_USERNAME" \
            --password-stdin
      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
      - name: Update Helm dependencies
        env:
          ENV: ${{ inputs.environment }}
        run: make -C helm update-deps ENV="$ENV"
      - name: Setup namespace and secrets
        env:
          NAMESPACE: ${{ needs.setup.outputs.namespace }}
          PACKAGE: ${{ needs.setup.outputs.package }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          MDREPO_CLIENT_ID: ${{ secrets.MDREPO_CLIENT_ID }}
          MDREPO_CLIENT_SECRET: ${{ secrets.MDREPO_CLIENT_SECRET }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oidc-credentials \
            --from-literal=client_id="$OAUTH_CLIENT_ID" \
            --from-literal=client_secret="$OAUTH_CLIENT_SECRET" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic "$PACKAGE"-s3-creds \
            --from-literal=S3_ACCESS_KEY="$S3_ACCESS_KEY" \
            --from-literal=S3_SECRET_KEY="$S3_SECRET_KEY" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic "$PACKAGE"-mdrepo-credentials \
            --from-literal=client_id="$MDREPO_CLIENT_ID" \
            --from-literal=client_secret="$MDREPO_CLIENT_SECRET" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl get secret tuner-auth -n "$NAMESPACE" >/dev/null 2>&1 || \
            kubectl create secret generic tuner-auth \
            --from-literal=user="tuner" \
            --from-literal=password="$(openssl rand -base64 32)" \
            -n "$NAMESPACE"
      - name: Deploy
        env:
          ENV: ${{ inputs.environment }}
          IMAGE_VERSION: ${{ inputs.image-version }}
        run: make -C helm deploy ENV="$ENV" IMAGE_TAG="$IMAGE_VERSION"
      - name: Verify health
        env:
          HOSTNAME: ${{ needs.setup.outputs.hostname }}
        run: |
          URL="https://$HOSTNAME/hub/health"
          for _ in $(seq 1 30); do curl -sf "$URL" --max-time 10 && exit 0; sleep 10; done
          echo "::error::Health check failed: $URL"; exit 1
      - name: Deployment diagnostics
        if: failure()
        env:
          NS: ${{ needs.setup.outputs.namespace }}
          PKG: ${{ needs.setup.outputs.package }}
        run: |
          helm status "$PKG" -n "$NS" || true
          helm history "$PKG" -n "$NS" || true
          kubectl get pods,deployments,events -n "$NS" --sort-by=.metadata.creationTimestamp || true
          exit 1
