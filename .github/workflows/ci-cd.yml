name: CI/CD

on:
  push:
    branches: [dev, master]

permissions:
  contents: read

env:
  REGISTRY: cerit.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
            echo "TAG=dev" >> $GITHUB_ENV
          fi

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push dashboard
        # if: contains(github.event.head_commit.modified, 'dashboard/') || contains(github.event.head_commit.added, 'dashboard/')
        run: |
          make build-dashboard ENV=${{ env.ENV }} IMAGE_TAG=${{ env.TAG }}
          make push-dashboard ENV=${{ env.ENV }} IMAGE_TAG=${{ env.TAG }}

      - name: Build and push notebook
        # if: contains(github.event.head_commit.modified, 'notebook/') || contains(github.event.head_commit.added, 'notebook/')
        run: |
          make build-notebook ENV=${{ env.ENV }} IMAGE_TAG=${{ env.TAG }}
          make push-notebook ENV=${{ env.ENV }} IMAGE_TAG=${{ env.TAG }}

      - name: Build and push mdrun-api
        # if: contains(github.event.head_commit.modified, 'mdrun-api/') || contains(github.event.head_commit.added, 'mdrun-api/')
        run: |
          make build-mdrun-api ENV=${{ env.ENV }} IMAGE_TAG=${{ env.TAG }}
          make push-mdrun-api ENV=${{ env.ENV }} IMAGE_TAG=${{ env.TAG }}

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Setup namespace and secrets
        run: |
          NAMESPACE=$(yq '.${{ env.ENV }}Namespace' config.yaml)
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret generic oidc-credentials \
            --from-literal=client_id="${{ secrets.OAUTH_CLIENT_ID }}" \
            --from-literal=client_secret="${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret generic mddash-kubeconfig-secret \
            --from-file=config=$HOME/.kube/config \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          NAMESPACE=$(yq '.${{ env.ENV }}Namespace' config.yaml)
          
          if helm status mddash -n ${NAMESPACE} >/dev/null 2>&1; then
            make -C helm upgrade ENV=${{ env.ENV }} NAMESPACE=${NAMESPACE}
          else
            make -C helm install ENV=${{ env.ENV }} NAMESPACE=${NAMESPACE}
          fi
