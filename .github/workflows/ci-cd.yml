name: CI/CD

on:
  push:
    branches: [dev, master]

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      tag: ${{ steps.set-env.outputs.tag }}
      registry: ${{ steps.set-env.outputs.registry }}
      config: ${{ steps.set-env.outputs.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            CONFIG_FILE="config.yaml"
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            CONFIG_FILE="config.dev.yaml"
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

          echo "config=${CONFIG_FILE}" >> $GITHUB_OUTPUT
          REGISTRY=$(yq '.registry' ${CONFIG_FILE} | cut -d'/' -f1)
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

  # Build UI first (proxy depends on it)
  build-ui:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qE '^dashboard/ui/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push UI
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: dashboard/ui
          file: dashboard/ui/Dockerfile
          push: true
          tags: ${{ needs.setup.outputs.registry }}/xkrasa/mddash-ui:${{ needs.setup.outputs.tag }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  # Build proxy after UI (needs UI image)
  build-proxy:
    needs: [setup, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Rebuild proxy if UI or proxy changed
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qE '^dashboard/(ui|proxy)/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push proxy
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: dashboard/proxy
          file: dashboard/proxy/Dockerfile
          push: true
          tags: ${{ needs.setup.outputs.registry }}/xkrasa/mddash-proxy:${{ needs.setup.outputs.tag }}
          build-args: |
            UI_IMAGE=${{ needs.setup.outputs.registry }}/xkrasa/mddash-ui:${{ needs.setup.outputs.tag }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

  # Build independent sidecars in parallel
  build-sidecars:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sidecar:
          - name: auth
            path: dashboard/auth
          - name: api
            path: dashboard/api
          - name: s3sync
            path: dashboard/s3-sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -q '^${{ matrix.sidecar.path }}/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [[ "${{ needs.setup.outputs.env }}" == "dev" && "${{ matrix.sidecar.name }}" =~ ^(api|auth)$ ]]; then
            echo "file=Dockerfile.dev" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.sidecar.name }}
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.sidecar.path }}
          file: ${{ matrix.sidecar.path }}/${{ steps.dockerfile.outputs.file }}
          push: true
          tags: ${{ needs.setup.outputs.registry }}/xkrasa/mddash-${{ matrix.sidecar.name }}:${{ needs.setup.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.sidecar.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sidecar.name }}

  # Build other components in parallel
  build-components:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: notebook
            path: notebook
          - name: mdrun-api
            path: mdrun-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -q '^${{ matrix.component.path }}/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.component.name }}
        if: steps.changes.outputs.changed == 'true'
        run: |
          make build-${{ matrix.component.name }} ENV=${{ needs.setup.outputs.env }} IMAGE_TAG=${{ needs.setup.outputs.tag }}
          make push-${{ matrix.component.name }} ENV=${{ needs.setup.outputs.env }} IMAGE_TAG=${{ needs.setup.outputs.tag }}

  push-mdrun-api-chart:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -q '^helm/charts/mdrun-api/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Helm
        if: steps.changes.outputs.changed == 'true'
        uses: azure/setup-helm@v3

      - name: Login to registry
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login ${{ needs.setup.outputs.registry }} \
            --username ${{ secrets.REGISTRY_USERNAME }} \
            --password-stdin

      - name: Package and push mdrun-api chart
        if: steps.changes.outputs.changed == 'true'
        run: |
          make push-mdrun-api-chart ENV=${{ needs.setup.outputs.env }} IMAGE_TAG=${{ needs.setup.outputs.tag }}

  check-changes:
    needs: [build-ui, build-proxy, build-sidecars, build-components, push-mdrun-api-chart]
    runs-on: ubuntu-latest
    outputs:
      any_changes: ${{ steps.aggregate.outputs.any_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for deployment-related changes
        id: check-deploy
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "deploy_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qE '^(helm/charts/mddash/|config\.yaml|config\.dev\.yaml|dashboard/|notebook/|mdrun-api/)'; then
            echo "deploy_changed=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Aggregate changes
        id: aggregate
        run: |
          if [[ "${{ steps.check-deploy.outputs.deploy_changed }}" == "true" ]] || \
             [[ "${{ needs.push-mdrun-api-chart.outputs.changed }}" == "true" ]]; then
            echo "any_changes=true" >> $GITHUB_OUTPUT
          else
            echo "any_changes=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: [setup, check-changes]
    if: needs.check-changes.outputs.any_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo wget -qO /usr/local/bin/gomplate https://github.com/hairyhenderson/gomplate/releases/latest/download/gomplate_linux-amd64
          sudo chmod +x /usr/local/bin/gomplate

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Update Helm dependencies
        run: |
          make -C helm update ENV=${{ needs.setup.outputs.env }}

      - name: Setup namespace and secrets
        run: |
          NAMESPACE=$(yq '.namespace' ${{ needs.setup.outputs.config }})
          PACKAGE=$(yq '.helm.package' ${{ needs.setup.outputs.config }})
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic oidc-credentials \
            --from-literal=client_id="${{ secrets.OAUTH_CLIENT_ID }}" \
            --from-literal=client_secret="${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic ${PACKAGE}-kubeconfig-secret \
            --from-file=config=$HOME/.kube/config \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic ${PACKAGE}-s3-creds \
            --from-literal=S3_ACCESS_KEY="${{ secrets.MINIO_ROOT_USER }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.MINIO_ROOT_PASSWORD }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic minio-root-config \
            --from-literal=config.env="export MINIO_ROOT_USER=\"${{ secrets.MINIO_ROOT_USER }}\"
          export MINIO_ROOT_PASSWORD=\"${{ secrets.MINIO_ROOT_PASSWORD }}\"" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          NAMESPACE=$(yq '.namespace' ${{ needs.setup.outputs.config }})
          PACKAGE=$(yq '.helm.package' ${{ needs.setup.outputs.config }})

          if helm status ${PACKAGE} -n ${NAMESPACE} >/dev/null 2>&1; then
            make -C helm upgrade ENV=${{ needs.setup.outputs.env }}
          else
            make -C helm install ENV=${{ needs.setup.outputs.env }}
          fi
