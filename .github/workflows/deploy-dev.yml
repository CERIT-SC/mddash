name: Deploy Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image-version: dev
      config-file: config.dev.yaml
      release-mode: false
      git-ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
