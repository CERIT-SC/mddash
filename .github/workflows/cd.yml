name: CD

on:
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      tag: ${{ steps.set-env.outputs.tag }}
      registry: ${{ steps.set-env.outputs.registry }}
      config: ${{ steps.set-env.outputs.config }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate secrets
        run: |
          MISSING_SECRETS=()
          check_secret() {
            if [ -z "$1" ]; then
              MISSING_SECRETS+=("$2")
            fi
          }
          check_secret "${{ secrets.REGISTRY_USERNAME }}" "REGISTRY_USERNAME"
          check_secret "${{ secrets.REGISTRY_PASSWORD }}" "REGISTRY_PASSWORD"
          check_secret "${{ secrets.KUBECONFIG }}" "KUBECONFIG"
          check_secret "${{ secrets.OAUTH_CLIENT_ID }}" "OAUTH_CLIENT_ID"
          check_secret "${{ secrets.OAUTH_CLIENT_SECRET }}" "OAUTH_CLIENT_SECRET"
          check_secret "${{ secrets.S3_ACCESS_KEY }}" "S3_ACCESS_KEY"
          check_secret "${{ secrets.S3_SECRET_KEY }}" "S3_SECRET_KEY"
          check_secret "${{ secrets.MDREPO_CLIENT_ID }}" "MDREPO_CLIENT_ID"
          check_secret "${{ secrets.MDREPO_CLIENT_SECRET }}" "MDREPO_CLIENT_SECRET"
          check_secret "${{ secrets.TUNER_USER }}" "TUNER_USER"
          check_secret "${{ secrets.TUNER_PASSWORD }}" "TUNER_PASSWORD"
          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "::error::Secret $secret is missing or empty"
            done
            exit 1
          fi

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            CONFIG_FILE="config.yaml"
            TAG="$(git rev-parse --short HEAD)"
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          else
            CONFIG_FILE="config.dev.yaml"
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "config=${CONFIG_FILE}" >> $GITHUB_OUTPUT
          REGISTRY=$(yq '.registry' ${CONFIG_FILE} | cut -d'/' -f1)
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

  changes:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      proxy: ${{ steps.filter.outputs.proxy }}
      api: ${{ steps.filter.outputs.api }}
      auth: ${{ steps.filter.outputs.auth }}
      s3sync: ${{ steps.filter.outputs.s3sync }}
      notebook: ${{ steps.filter.outputs.notebook }}
      mdrun-api: ${{ steps.filter.outputs.mdrun-api }}
      landing: ${{ steps.filter.outputs.landing }}
      helm: ${{ steps.filter.outputs.helm }}
      any: ${{ steps.matrix.outputs.any }}
      sidecars: ${{ steps.matrix.outputs.sidecars }}
      all_sidecars: '[{"name":"ui","path":"dashboard/ui","context":"dashboard/ui"},{"name":"api","path":"dashboard/api","context":"."},{"name":"auth","path":"dashboard/auth","context":"."},{"name":"s3sync","path":"dashboard/s3-sync","context":"dashboard/s3-sync"}]'
      components: ${{ steps.matrix.outputs.components }}
      all_components: '[{"name":"notebook","path":"notebook","context":"notebook"},{"name":"mdrun-api","path":"mdrun-api","context":"."},{"name":"landing","path":"landing","context":"landing"}]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            ui:
              - 'dashboard/ui/**'
            proxy:
              - 'dashboard/proxy/**'
              - 'dashboard/ui/**'
            api:
              - 'dashboard/api/**'
            auth:
              - 'dashboard/auth/**'
            s3sync:
              - 'dashboard/s3-sync/**'
            notebook:
              - 'notebook/**'
            mdrun-api:
              - 'mdrun-api/**'
            landing:
              - 'landing/**'
            helm:
              - 'helm/**'
              - 'config.yaml'
              - 'config.dev.yaml'
      - name: Compute matrices
        id: matrix
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          jq -n --argjson changes "$CHANGES" '
            {
              "ui": {"name":"ui","path":"dashboard/ui","context":"dashboard/ui"},
              "proxy": {"name":"proxy","path":"dashboard/proxy","context":"dashboard/proxy"},
              "api": {"name":"api","path":"dashboard/api","context":"."},
              "auth": {"name":"auth","path":"dashboard/auth","context":"."},
              "s3sync": {"name":"s3sync","path":"dashboard/s3-sync","context":"dashboard/s3-sync"},
              "notebook": {"name":"notebook","path":"notebook","context":"notebook"},
              "mdrun-api": {"name":"mdrun-api","path":"mdrun-api","context":"."},
              "landing": {"name":"landing","path":"landing","context":"landing"}
            } as $cfg |
            {
              sidecars: [($changes[] | select(in($cfg)) | select(. != "notebook" and . != "mdrun-api" and . != "landing" and . != "proxy") | $cfg[.])],
              components: [($changes[] | select(in($cfg)) | select(. == "notebook" or . == "mdrun-api" or . == "landing") | $cfg[.])],
              any: (if ($changes | length) > 0 then "true" else "false" end)
            } | to_entries[] | "\(.key)=\(.value)"
          ' -r >> "$GITHUB_OUTPUT"

  build:
    needs: [setup, changes]
    if: |
      needs.changes.outputs.sidecars != '[]' || (
        needs.setup.outputs.env == 'prod' && needs.changes.outputs.any == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sidecar: ${{ fromJson(needs.setup.outputs.env == 'prod' && needs.changes.outputs.all_sidecars || needs.changes.outputs.sidecars) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [[ "${{ needs.setup.outputs.env }}" == "dev" && "${{ matrix.sidecar.name }}" =~ ^(api|auth)$ ]]; then
            echo "file=Dockerfile.dev" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          fi
      - name: Build and push ${{ matrix.sidecar.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.sidecar.context }}
          file: ${{ matrix.sidecar.path }}/${{ steps.dockerfile.outputs.file }}
          push: true
          tags: |
            ${{ needs.setup.outputs.registry }}/xkrasa/mddash-${{ matrix.sidecar.name }}:${{ needs.setup.outputs.tag }}
          cache-from: type=registry,ref=${{ needs.setup.outputs.registry }}/xkrasa/mddash-${{ matrix.sidecar.name }}:buildcache
          cache-to: type=registry,ref=${{ needs.setup.outputs.registry }}/xkrasa/mddash-${{ matrix.sidecar.name }}:buildcache,mode=max

  build-components:
    needs: [setup, changes]
    if: |
      needs.changes.outputs.components != '[]' || (
        needs.setup.outputs.env == 'prod' && needs.changes.outputs.any == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.env == 'prod' && needs.changes.outputs.all_components || needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set image tag
        id: tag
        run: |
          if [ "${{ matrix.component.name }}" = "notebook" ]; then
            IMAGE="${{ needs.setup.outputs.registry }}/xkrasa/mddash-notebook"
          elif [ "${{ matrix.component.name }}" = "landing" ]; then
            IMAGE="${{ needs.setup.outputs.registry }}/xkrasa/mddash-landing"
          else
            IMAGE="${{ needs.setup.outputs.registry }}/xkrasa/mdrun-api"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.path }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ needs.setup.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.tag.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tag.outputs.image }}:buildcache,mode=max

  build-proxy:
    needs: [setup, changes, build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.changes.outputs.proxy == 'true' || (needs.setup.outputs.env == 'prod' && needs.changes.outputs.any == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push proxy
        uses: docker/build-push-action@v7
        with:
          context: dashboard/proxy
          file: dashboard/proxy/Dockerfile
          push: true
          tags: |
            ${{ needs.setup.outputs.registry }}/xkrasa/mddash-proxy:${{ needs.setup.outputs.tag }}
          cache-from: type=registry,ref=${{ needs.setup.outputs.registry }}/xkrasa/mddash-proxy:buildcache
          cache-to: type=registry,ref=${{ needs.setup.outputs.registry }}/xkrasa/mddash-proxy:buildcache,mode=max
          build-args: |
            UI_IMAGE=${{ needs.setup.outputs.registry }}/xkrasa/mddash-ui:${{ needs.setup.outputs.tag }}

  deploy:
    needs: [setup, changes, build, build-proxy, build-components, push-mdrun-api-chart]
    if: |
      always() &&
      needs.changes.outputs.any == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.build-proxy.result == 'success' || needs.build-proxy.result == 'skipped') &&
      (needs.build-components.result == 'success' || needs.build-components.result == 'skipped') &&
      (needs.push-mdrun-api-chart.result == 'success' || needs.push-mdrun-api-chart.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo wget -qO /usr/local/bin/gomplate https://github.com/hairyhenderson/gomplate/releases/latest/download/gomplate_linux-amd64
          sudo chmod +x /usr/local/bin/gomplate
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Update Helm dependencies
        run: make -C helm update ENV=${{ needs.setup.outputs.env }}
      - name: Setup namespace and secrets
        run: |
          NAMESPACE=$(yq '.namespace' ${{ needs.setup.outputs.config }})
          PACKAGE=$(yq '.helm.package' ${{ needs.setup.outputs.config }})
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oidc-credentials \
            --from-literal=client_id="${{ secrets.OAUTH_CLIENT_ID }}" \
            --from-literal=client_secret="${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic ${PACKAGE}-s3-creds \
            --from-literal=S3_ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            --from-literal=S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic ${PACKAGE}-mdrepo-credentials \
            --from-literal=client_id="${{ secrets.MDREPO_CLIENT_ID }}" \
            --from-literal=client_secret="${{ secrets.MDREPO_CLIENT_SECRET }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic tuner-auth \
            --from-literal=user="${{ secrets.TUNER_USER }}" \
            --from-literal=password="${{ secrets.TUNER_PASSWORD }}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy
        run: |
          NAMESPACE=$(yq '.namespace' ${{ needs.setup.outputs.config }})
          PACKAGE=$(yq '.helm.package' ${{ needs.setup.outputs.config }})
          if helm status ${PACKAGE} -n ${NAMESPACE} >/dev/null 2>&1; then
            make -C helm deploy ENV=${{ needs.setup.outputs.env }}
          else
            make -C helm install ENV=${{ needs.setup.outputs.env }}
          fi

  verify:
    needs: [setup, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Verify deployment health
        run: |
          NAMESPACE=$(yq '.namespace' ${{ needs.setup.outputs.config }})
          PACKAGE=$(yq '.helm.package' ${{ needs.setup.outputs.config }})
          echo "=== Helm Status ==="
          helm status ${PACKAGE} -n ${NAMESPACE} || true
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${NAMESPACE}
      - name: Check Hub Health
        run: |
          if [[ "${{ needs.setup.outputs.env }}" == "prod" ]]; then
            URL="https://mddash.dyn.cloud.e-infra.cz/hub/health"
          else
            URL="https://mddash-dev.dyn.cloud.e-infra.cz/hub/health"
          fi
          curl -sf "$URL" --max-time 60

  push-mdrun-api-chart:
    needs: [setup, changes]
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login ${{ needs.setup.outputs.registry }} \
            --username ${{ secrets.REGISTRY_USERNAME }} \
            --password-stdin
      - name: Package and push mdrun-api chart
        run: |
          make push-mdrun-api-chart ENV=${{ needs.setup.outputs.env }} IMAGE_TAG=${{ needs.setup.outputs.tag }}
