name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  validate:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate SemVer and master ancestry
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not strict SemVer (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/master || { echo "::error::'$TAG' is not an ancestor of origin/master"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: [validate, ci]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image-version: ${{ needs.validate.outputs.version }}
      config-file: config.yaml
      release-mode: true
    secrets: inherit

  github-release:
    timeout-minutes: 5
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
