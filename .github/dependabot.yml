# Manual updates (not automatable): the pnpm version (packageManager,
# devcontainer pnpmVersion, `npm install -g pnpm@X` in the hub/landing/
# dashboard-ui Dockerfiles) and gomplate/actionlint/yq in workflow `run:` steps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # jsdom 29+ CSSOM makes re-opened Radix overlays dismiss instantly; retest before lifting.
      - dependency-name: jsdom
        versions: [">=29.0.0"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /notebook
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      notebook-requirements:
        patterns:
          - "*"
    ignore:
      # 4.x sdists ship a stale nglview-js-widgets labextension vs their 4.0 kernel side
      - dependency-name: nglview
        versions: [">=4.0"]

  - package-ecosystem: pip
    directory: /tuner/worker
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      tuner-worker-requirements:
        patterns:
          - "*"

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: helm
    directory: /helm/charts/mddash
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /dashboard/api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # Ray 2.54 (external gromacs worker image) has no Python 3.14 support
      - dependency-name: python
        versions: [">=3.14"]
      - dependency-name: python
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: /dashboard/archive-worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /dashboard/auth
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: python
        versions: [">=3.14"]
      - dependency-name: python
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: /dashboard/mdrepo-uploader
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
