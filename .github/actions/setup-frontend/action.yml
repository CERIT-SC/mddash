name: Setup frontend
description: pnpm, Node with cached store, and workspace install for the frontend jobs.
# Callers must run actions/checkout first: local actions are resolved before any
# step executes, so this composite cannot fetch itself.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
