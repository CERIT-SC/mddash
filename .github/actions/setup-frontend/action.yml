name: Setup frontend
description: pnpm, Node with cached store, and workspace install for the frontend jobs.
# Callers must run actions/checkout first: local actions are resolved before any
# step executes, so this composite cannot fetch itself.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
