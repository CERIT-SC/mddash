# Development environment configuration

# Kubernetes namespace
namespace: krasa-ns

# Rancher project ID for user namespace annotation
rancherProjectId: "c-m-qvndqhf6:p-8rjpv"

# Global storage class for all persistent volumes
storageClassName: nfs-csi

# Container and helm chart registry
registry: cerit.io/xkrasa

# Dashboard application (JupyterHub singleuser pod)
dashboard:
  hostname: mddash-dev.dyn.cloud.e-infra.cz
  # Container images for the singleuser pod
  containers:
    proxy:
      image: cerit.io/xkrasa/mddash-proxy
      platform: linux/amd64
      tag: dev
    api:
      image: cerit.io/xkrasa/mddash-api
      platform: linux/amd64
      tag: dev
    jupyter:
      image: cerit.io/xkrasa/mddash-jupyter
      platform: linux/amd64
      tag: dev
    s3Sync:
      image: cerit.io/xkrasa/mddash-s3-sync
      platform: linux/amd64
      tag: dev

# mdrun-api service
mdrunApi:
  image: cerit.io/xkrasa/mdrun-api
  platform: linux/amd64
  tag: dev
  storage:  # Persistent storage for mdrun-api database
    size: 2Gi

# Notebook image (spawned by Dashboard pod)
notebook:
  image: cerit.io/xkrasa/mddash-notebook
  platform: linux/amd64
  tag: dev

# MinIO object storage tenant
minio:
  servers: 2
  volumesPerServer: 2
  poolSize: 10Gi    # Storage pool size

resources:
  singleuser:
    memory:
      guarantee: 512M
      limit: 4G
    cpu:
      guarantee: 0.2
      limit: 1
  proxy:
    memory:
      guarantee: 128M
      limit: 256M
    cpu:
      guarantee: 0.05
      limit: 0.2
  namespaceQuota:
    requestsCpu: "2000m"
    requestsMemory: "4Gi"
    limitsCpu: "4000m"
    limitsMemory: "8Gi"
  pvcStorageSize: 10Gi

helm:
  package: mddash-dev
