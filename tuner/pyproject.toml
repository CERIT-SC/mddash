[project]
name = "tuner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.125",
    "pydantic>=2",
    "python-multipart>=0.0.20",
    "ray[client]==2.54.0",
    "sqlalchemy>=2",
    "starlette>=0.49",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["e2e: end-to-end API tests that require a running deployed API"]
