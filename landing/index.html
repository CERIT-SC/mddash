<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong
      // color scheme. An explicit saved choice wins; otherwise the OS
      // color-scheme preference is followed (system theme on first load).
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var el = document.documentElement;
          el.classList.toggle("dark", dark);
          el.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          // Privacy-restricted contexts throw on storage access. Match the
          // React-side default (light) instead of forcing dark. No .dark class
          // is added, so the document resolves light; only color-scheme is set.
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <title>MDDash | Virtual Research Environment for Molecular Dynamics</title>
    <meta
      name="description"
      content="Prepare, tune, run, analyze, and publish molecular dynamics simulations — without leaving the browser. One platform for the full lifecycle, powered by e-INFRA CZ."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Inter+Tight:wght@300;400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
