[project]
name = "dashboard-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask",
    "flask-cors",
    "flask-sqlalchemy>=3.0",
    "flask-marshmallow",
    "flask-migrate",
    "marshmallow-sqlalchemy",
    "cachetools",
    "werkzeug",
    "requests",
    "kubernetes",
    "gunicorn",
    "pyyaml",
    "jsonschema>=4.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-flask>=1.3",
    "responses>=0.25",
    "watchdog",
    "ty",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# 4 workers: GitHub-hosted runners for public repos have 4 vCPUs; do not raise
# without re-measuring (worker startup ~1s each dominates on short suites).
addopts = "-n 4 --dist loadfile"
testpaths = ["tests"]
