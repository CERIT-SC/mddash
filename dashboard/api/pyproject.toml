[project]
name = "dashboard-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-cors",
    "flask-sqlalchemy>=3.0",
    "flask-marshmallow",
    "flask-migrate",
    "marshmallow-sqlalchemy",
    "cachetools",
    "werkzeug",
    "requests",
    "kubernetes",
    "gunicorn",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-flask>=1.3",
    "responses>=0.25",
    "watchdog",
    "ty",
]
