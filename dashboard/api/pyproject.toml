[project]
name = "dashboard-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.125",
    "uvicorn>=0.38",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.21",
    "alembic>=1.13",
    "httpx>=0.28",
    "kubernetes-asyncio>=32",
    "anyio>=4.6",
    "cachetools",
    "pyyaml",
    "jsonschema>=4.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.12",
    "respx>=0.22",
    "ty",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# 4 workers: GitHub-hosted runners for public repos have 4 vCPUs; do not raise
# without re-measuring (worker startup ~1s each dominates on short suites).
addopts = "-n 4 --dist loadfile"
testpaths = ["tests"]
