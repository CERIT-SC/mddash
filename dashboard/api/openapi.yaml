            type: integer
          type: array
        eigenvalues:
          items:
            type: number
          type: array
        projections:
          $ref: '#/components/schemas/NumberMatrix'
      additionalProperties: false
      type: object
      required:
      - framestep
      - atoms
      - eigenvalues
      - projections
      description: Principal component analysis.
    PodStatus:
      type: string
      enum:
      - UNKNOWN
      - PENDING
      - RUNNING
      - ERROR
      - DOWN
      - TERMINATING
      - TERMINATED
      description: Status values for Kubernetes pods.
    Problem:
      additionalProperties: false
      description: RFC 9457 problem details. The HTTP status is carried by the response status line.
      properties:
        type:
          format: uri
          pattern: '^urn:mddash:'
          type: string
        title:
          minLength: 1
          type: string
        detail:
          minLength: 1
          type: string
        solution:
          minLength: 1
          type: string
      required:
      - type
      - title
      - detail
      type: object
    PublicationFile:
      properties:
        role:
          type: string
        path:
          type: string
        url:
          type: string
      additionalProperties: false
      type: object
      required:
      - path
      - url
      description: A file of an MDPosit publication package.
    PublishRequest:
      properties:
        target:
          type: string
          enum:
          - invenio
          - mdposit
          default: invenio
        simulation_path:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: false
      type: object
      description: Publication target (MDPosit requires the simulation to publish).
    PublishStatus:
      properties:
        experiment_id:
          type: string
        mdrepo_id:
          anyOf:
          - type: string
          - type: 'null'
        draft_url:
          anyOf:
          - type: string
          - type: 'null'
        upload_state:
          anyOf:
          - type: string
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
        total_files:
          type: integer
          minimum: 0.0
        completed_files:
          type: integer
          minimum: 0.0
        total_bytes:
          type: integer
          minimum: 0.0
        completed_bytes:
          type: integer
          minimum: 0.0
        upload_attempt_id:
          type: string
        failed_files:
          items:
            $ref: '#/components/schemas/FailedUploadFile'
          type: array
      additionalProperties: true
      type: object
      required:
      - experiment_id
      - mdrepo_id
      - draft_url
      - upload_state
      - reason
      - total_files
      - completed_files
      - total_bytes
      - completed_bytes
      description: Durable MDRepo upload status merged with live Job state.
    Simulation:
      properties:
        simulation_path:
          type: string
        name:
          type: string
        engine:
          type: string
        files:
          $ref: '#/components/schemas/SimulationFiles'
        resolved_files:
          $ref: '#/components/schemas/SimulationFiles'
        extra_args:
          type: string
        locked:
          type: boolean
        valid:
          type: boolean
        errors:
          items:
            type: string
          type: array
        missing_files:
          items:
            type: string
          type: array
        step:
          type: integer
          maximum: 3.0
          minimum: 0.0
        status:
          type: string
        live:
          type: boolean
        last_activity:
          type: number
      additionalProperties: false
      type: object
      required:
      - simulation_path
      - name
      - engine
      - files
      - resolved_files
      - extra_args
      - locked
      - valid
      - errors
      - missing_files
      - step
      - status
      - live
      - last_activity
      description: A simulation manifest with its validation, lock, and wizard state.
    SimulationFiles:
      additionalProperties:
        type: string
        minLength: 1
      type: object
    SimulationJob:
      properties:
        id:
          type: string
        experiment_id:
          type: string
        simulation_path:
          type: string
        created_at:
          type: string
          format: date-time
        engine:
          $ref: '#/components/schemas/Engine'
        np:
          type: integer
          minimum: 1.0
        ntomp:
          type: integer
          minimum: 1.0
        status:
          $ref: '#/components/schemas/JobStatus'
        start_timestamp:
          anyOf:
          - type: integer
          - type: 'null'
        finish_timestamp:
          anyOf:
          - type: integer
          - type: 'null'
        nsteps:
          anyOf:
          - type: integer
          - type: 'null'
        nsteps_done:
          anyOf:
          - type: integer
          - type: 'null'
          description: Steps completed so far (parsed from the engine log)
        performance:
          anyOf:
          - type: number
          - type: 'null'
        estimated_time:
          anyOf:
          - type: integer
          - type: 'null'
          description: Estimated seconds until completion
        is_live:
          type: boolean
        log_lines:
          $ref: '#/components/schemas/SimulationJobLogLines'
      additionalProperties: true
      type: object
      required:
      - id
      - experiment_id
      - simulation_path
      - created_at
      - engine
      - np
      - ntomp
      - status
      - is_live
      description: A production run of one simulation manifest (engine-specific fields pass through).
    SimulationJobLogLines:
      properties:
        gmx:
          anyOf:
          - type: integer
          - type: 'null'
          description: Engine log (GROMACS only)
        mdout:
          anyOf:
          - type: integer
          - type: 'null'
          description: Engine log (AMBER only)
        stdout:
          anyOf:
          - type: integer
          - type: 'null'
        stderr:
          anyOf:
          - type: integer
          - type: 'null'
      additionalProperties: false
      type: object
      description: Line counts per log stream for sizing badges without fetching logs; null while a stream's file does not
        exist yet.
    SimulationWrite:
      properties:
        simulation_path:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
          minLength: 1
        engine:
          anyOf:
          - $ref: '#/components/schemas/Engine'
          - type: 'null'
        files:
          $ref: '#/components/schemas/SimulationFiles'
        extra_args:
          type: string
          default: ''
      additionalProperties: false
      type: object
      required:
      - name
      - files
      description: Simulation manifest content to create or update.
    StartNotebookRequest:
      properties:
        tier:
          anyOf:
          - type: string
            enum:
            - 1x
            - 2x
            - 4x
          - type: 'null'
        gpu:
          type: boolean
          default: false
      additionalProperties: false
      type: object
      description: Notebook start options.
    StatisticalData:
      properties:
        average:
          type: number
        stddev:
          type: number
        min:
          type: number
        max:
          type: number
        data:
          items:
            type: number
          type: array
      additionalProperties: false
      type: object
      required:
      - average
      - stddev
      - min
      - max
      - data
      description: Summary statistics of a series.
    StatisticalSeriesResult:
      properties:
        start:
          type: number
        step:
          type: number
        y:
          additionalProperties:
            $ref: '#/components/schemas/StatisticalData'
          type: object
          minProperties: 1
      additionalProperties: false
      type: object
      required:
      - step
      - y
      description: Per-key statistical series.
    ThicknessResult:
      properties:
        step:
          type: number
        data:
          additionalProperties:
            items:
              type: number
            type: array
          type: object
      additionalProperties: false
      type: object
      required:
      - data
      description: Membrane thickness over time.
    TunerJob:
      properties:
        id:
          type: string
        experiment_id:
          type: string
        simulation_path:
          type: string
        nsteps:
          type: integer
        error_message:
          anyOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
        is_stopped:
          type: boolean
        engine:
          $ref: '#/components/schemas/Engine'
        tuner_status:
          $ref: '#/components/schemas/JobStatus'
        is_live:
          type: boolean
        sim_length_ns:
          anyOf:
          - type: number
          - type: 'null'
        trials:
          items:
            $ref: '#/components/schemas/TunerTrial'
          type: array
      additionalProperties: false
      type: object
      required:
      - id
      - experiment_id
      - simulation_path
      - nsteps
      - created_at
      - is_stopped
      - engine
      - tuner_status
      - is_live
      - trials
      description: Tuner job for one simulation manifest.
    TunerJobRequest:
      properties:
        simulation_path:
          type: string
          minLength: 1
        nsteps:
          type: integer
          minimum: 1.0
      additionalProperties: false
      type: object
      required:
      - simulation_path
      - nsteps
      description: Tuning job for a simulation manifest.
    TunerTrial:
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        performance:
          anyOf:
          - type: number
          - type: 'null'
      additionalProperties: true
      type: object
      description: One tuning trial as reported by the tuner (engine-specific keys pass through).
    UpdateExperiment:
      properties:
        name:
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      description: Editable experiment properties.
tags:
- name: System
- name: Experiments
- name: Simulations
- name: GROMACS
- name: AMBER
- name: Tuner
- name: Analysis
- name: Notebooks
- name: Files
- name: MDRepo
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
