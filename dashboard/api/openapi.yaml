openapi: 3.1.0
info:
  title: MDDash Dashboard API
  description: API for experiment, simulation, compute, analysis, notebook, file, and publication workflows.
  version: 1.0.0
servers:
- url: /
paths:
  /dash/api/:
    get:
      tags:
      - System
      summary: Check API health
      description: Health check.
      operationId: getApiRoot
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: string
                const: API is up!
  /dash/api/health:
    get:
      tags:
      - System
      summary: Check API health
      description: Health check.
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: string
                const: API is up!
  /dash/api/notebook-modules:
    get:
      tags:
      - Notebooks
      summary: List curated notebook modules
      description: Curated notebook module display metadata (no internal paths or URLs).
      operationId: listNotebookModules
      responses:
        '200':
          description: Public notebook module catalog
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NotebookModule'
                type: array
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/metrics:
    get:
      tags:
      - System
      summary: Get resource usage and limits
      description: Storage used/limit in bytes (used is null until the du monitor measures) and server uptime.
      operationId: getMetrics
      responses:
        '200':
          description: Resource metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/notebook-config:
    get:
      tags:
      - Notebooks
      summary: Get notebook resource configuration
      description: Available notebook resource tiers, the default tier, and the concurrent-notebook limit.
      operationId: getNotebookConfig
      responses:
        '200':
          description: Notebook tiers and default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookConfig'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments:
    get:
      tags:
      - Experiments
      summary: List experiments
      description: 'List all experiments.


        The dashboard polls this every 5s while any job is live; remote state of

        all experiments is fetched concurrently.'
      operationId: listExperiments
      responses:
        '200':
          description: Experiments
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Experiment'
                type: array
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Experiments
      summary: Create an experiment
      description: Create a new experiment from PDB, repository URL, or uploaded files.
      operationId: createExperiment
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateExperimentForm'
        required: true
      responses:
        '201':
          description: Created experiment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}:
    get:
      tags:
      - Experiments
      summary: Get an experiment
      description: Get an experiment by ID.
      operationId: getExperiment
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Experiment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Experiments
      summary: Update an experiment
      description: Update experiment properties (currently only the name).
      operationId: updateExperiment
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExperiment'
      responses:
        '200':
          description: Updated experiment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Experiments
      summary: Delete an experiment
      description: Delete an experiment and all associated resources.
      operationId: deleteExperiment
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Operation completed successfully
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/publish:
    post:
      tags:
      - Experiments
      summary: Publish an experiment
      description: Publish experiment to the requested target.
      operationId: publishExperiment
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '201':
          description: MDPosit publication package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MDPositPublication'
        '202':
          description: MDRepo publication accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MDRepoPublication'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/publish/status:
    get:
      tags:
      - Experiments
      summary: Get MDRepo upload status
      description: 'Durable MDRepo upload status: the PVC state document merged with live Kubernetes Job state.'
      operationId: getPublishStatus
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Publication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishStatus'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/archive:
    post:
      tags:
      - Experiments
      summary: Archive an experiment
      description: Mirror the experiment to S3 at _archives/<id>/ and free the local PVC (verified before deletion).
      operationId: archiveExperiment
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '202':
          description: Archive accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveAttempt'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Resource conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/restore:
    post:
      tags:
      - Experiments
      summary: Restore an archived experiment
      description: Copy the S3 archive back onto the local PVC and unfreeze the experiment.
      operationId: restoreExperiment
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '202':
          description: Restore accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveAttempt'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Resource conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/archive/status:
    get:
      tags:
      - Experiments
      summary: Get archive/restore status
      description: Archive/restore status (status doc reconciled with live Jobs).
      operationId: getArchiveStatus
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Archive status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveStatus'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/mdrepo/status:
    get:
      tags:
      - MDRepo
      summary: Get MDRepo authentication status
      description: Whether the session holds a token MDRepo accepts.
      operationId: getMDRepoStatus
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MDRepoStatus'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/mdrepo/auth:
    get:
      tags:
      - MDRepo
      summary: Begin MDRepo OAuth authorization
      description: Redirect to MDRepo's authorization page; `return_url` is where the callback lands afterwards.
      operationId: authorizeMDRepo
      parameters:
      - name: return_url
        in: query
        required: false
        schema:
          type: string
          default: /
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              required: true
              schema:
                type: string
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/mdrepo/callback:
    get:
      tags:
      - MDRepo
      summary: Complete MDRepo OAuth authorization
      description: Exchange the authorization code for tokens and redirect back with a success or error query parameter.
      operationId: completeMDRepoAuthorization
      parameters:
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      - name: error_description
        in: query
        required: false
        schema:
          type: string
          default: Authorization denied
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              required: true
              schema:
                type: string
  /dash/api/mdrepo/logout:
    post:
      tags:
      - MDRepo
      summary: Clear MDRepo credentials
      description: Remove all MDRepo tokens from the session.
      operationId: logoutMDRepo
      responses:
        '200':
          description: Logout confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/files:
    get:
      tags:
      - Files
      summary: List experiment files
      description: List files in an experiment directory, optionally filtered by extension.
      operationId: listExperimentFiles
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: ext
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated file extensions
        description: Comma-separated file extensions
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/files/{path}:
    get:
      tags:
      - Files
      summary: Download an experiment file
      description: Serve a file from an experiment directory inline.
      operationId: downloadExperimentFile
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: File contents; the actual media type is inferred from the file
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/simulations:
    get:
      tags:
      - Simulations
      summary: List simulation manifests
      description: List all simulations of an experiment.
      operationId: listSimulations
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Simulations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Simulation'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Simulations
      summary: Create a simulation manifest
      description: Create a new simulation manifest.
      operationId: createSimulation
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationWrite'
      responses:
        '201':
          description: Created simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Resource conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/simulations/{simulation_path}:
    get:
      tags:
      - Simulations
      summary: Get a simulation manifest
      description: Get a single simulation by its experiment-relative path.
      operationId: getSimulation
      parameters:
      - name: simulation_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Simulations
      summary: Update a simulation manifest
      description: Edit an unlocked simulation manifest.
      operationId: updateSimulation
      parameters:
      - name: simulation_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationWrite'
      responses:
        '200':
          description: Updated simulation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Resource conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Simulations
      summary: Delete a simulation manifest
      description: Delete a simulation manifest and cascade-delete all related jobs.
      operationId: deleteSimulation
      parameters:
      - name: simulation_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Operation completed successfully
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/gmx:
    get:
      tags:
      - GROMACS
      summary: List GROMACS jobs
      description: List all GROMACS jobs of an experiment.
      operationId: listGromacsJobs
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: GROMACS jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GromacsJob'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/gmx/{simulation_path}/stop:
    post:
      tags:
      - GROMACS
      summary: Stop a GROMACS run, preserving its data
      description: Stop the run gracefully, keeping all data and the job row.
      operationId: stopGromacsJob
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: simulation_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Operation completed successfully
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/gmx/{simulation_path}/extend:
    post:
      tags:
      - GROMACS
      summary: Extend a finished or stopped GROMACS run from its checkpoint
      description: Extend a finished or stopped run by `nsteps` additional steps, resuming from its checkpoint.
      operationId: extendGromacsJob
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: simulation_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendGromacsJobRequest'
      responses:
        '201':
          description: Created GROMACS run extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GromacsJob'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/gmx/{simulation_path}/log:
    get:
      tags:
      - GROMACS
      summary: Get a GROMACS job log
      description: Tail of one of the run's log streams (`gmx`, `stdout`, `stderr`).
      operationId: getGromacsJobLog
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: simulation_path
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: type
        in: query
        required: false
        schema:
          type: string
          default: gmx
      - name: tail
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 10000
      responses:
        '200':
          description: Text represented as a JSON string
