        in: query
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Supported MWF analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Resource could not be processed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/analysis/{job_id}/logs:
    get:
      tags:
      - Analysis
      summary: Get analysis job logs
      description: K8s pod logs of an analysis job, trimmed to start at the workflow start marker.
      operationId: getAnalysisJobLogs
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: tail
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 200
      responses:
        '200':
          description: Text represented as a JSON string
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dash/api/experiments/{experiment_id}/analysis/{job_id}:
    get:
      tags:
      - Analysis
      summary: Get an analysis job
      description: Get an analysis job by ID.
      operationId: getAnalysisJob
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Analysis job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Analysis
      summary: Delete an analysis job
      description: Delete an analysis job and its temporary files.
      operationId: deleteAnalysisJob
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '204':
          description: Operation completed successfully
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: RFC 9457 problem details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AmberJob:
      properties:
        id:
          type: string
        experiment_id:
          type: string
        simulation_path:
          type: string
        created_at:
          type: string
          format: date-time
        engine:
          $ref: '#/components/schemas/Engine'
        np:
          type: integer
          minimum: 1.0
        ntomp:
          type: integer
          minimum: 1.0
        status:
          $ref: '#/components/schemas/JobStatus'
        start_timestamp:
          anyOf:
          - type: integer
          - type: 'null'
        finish_timestamp:
          anyOf:
          - type: integer
          - type: 'null'
        nsteps:
          anyOf:
          - type: integer
          - type: 'null'
        nsteps_done:
          anyOf:
          - type: integer
          - type: 'null'
          description: Steps completed so far (parsed from the engine log)
        performance:
          anyOf:
          - type: number
          - type: 'null'
        estimated_time:
          anyOf:
          - type: integer
          - type: 'null'
          description: Estimated seconds until completion
        is_live:
          type: boolean
        log_lines:
          $ref: '#/components/schemas/SimulationJobLogLines'
        binary:
          type: string
        ewald:
          type: string
      additionalProperties: true
      type: object
      required:
      - id
      - experiment_id
      - simulation_path
      - created_at
      - engine
      - np
      - ntomp
      - status
      - is_live
      - binary
      - ewald
      description: AMBER production run.
    AmberJobRequest:
      properties:
        binary:
          type: string
        ewald:
          type: string
        np:
          type: integer
          minimum: 1.0
        ntomp:
          type: integer
          minimum: 1.0
      additionalProperties: false
      type: object
      required:
      - binary
      - ewald
      - np
      - ntomp
      description: Compute settings for an AMBER run.
    AnalysisJob:
      properties:
        id:
          type: string
        experiment_id:
          type: string
        simulation_path:
          type: string
        analysis_name:
          type: string
          enum:
          - apl
          - clusters
          - density
          - dist
          - energies
          - hbonds
          - inter
          - linter
          - lorder
          - pairwise
          - pca
          - perres
          - pockets
          - rgyr
          - rmsds
          - rmsf
          - sas
          - thickness
          - tmscore
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/JobStatus'
        sim_progress:
          anyOf:
          - type: number
          - type: 'null'
          description: Fraction (0-1) of the simulation's steps available when the analysis inputs were snapshotted; null
            when unknown.
        structure_file:
          anyOf:
          - type: string
          - type: 'null'
        trajectory_file:
          anyOf:
          - type: string
          - type: 'null'
        topology_file:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: true
      type: object
      required:
      - id
      - experiment_id
      - simulation_path
      - analysis_name
      - created_at
      - status
      description: On-demand mwf analysis job (input file paths pass through).
    AnalysisJobRequest:
      properties:
        simulation_path:
          type: string
          minLength: 1
        analysis:
          type: string
          enum:
          - apl
          - clusters
          - density
          - dist
          - energies
          - hbonds
          - inter
          - linter
          - lorder
          - pairwise
          - pca
          - perres
          - pockets
          - rgyr
          - rmsds
          - rmsf
          - sas
          - thickness
          - tmscore
        preprocessing_mode:
          type: string
          enum:
          - as_is
          - image
          - image_fit
          default: as_is
      additionalProperties: false
      type: object
      required:
      - simulation_path
      - analysis
      description: Analysis of a simulation's trajectory.
    AnalysisResult:
      anyOf:
      - $ref: '#/components/schemas/StatisticalSeriesResult'
      - $ref: '#/components/schemas/NamedSeriesResult'
      - $ref: '#/components/schemas/NamedDataResult'
      - $ref: '#/components/schemas/MatrixResult'
      - $ref: '#/components/schemas/PCAResult'
      - $ref: '#/components/schemas/ClustersResult'
      - $ref: '#/components/schemas/MembraneMapResult'
      - $ref: '#/components/schemas/ThicknessResult'
      - $ref: '#/components/schemas/InteractionResult'
    AnalysisVariant:
      properties:
        analysis:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      additionalProperties: true
      type: object
      required:
      - analysis
      - name
      description: One variant of a multi-file analysis (extra summary keys pass through).
    ArchiveAttempt:
      properties:
        attempt_id:
          type: string
      additionalProperties: false
      type: object
      required:
      - attempt_id
      description: Accepted archive or restore.
    ArchiveStatus:
      properties:
        experiment_id:
          type: string
        archive_state:
          anyOf:
          - type: string
            enum:
            - archiving
            - archived
            - restoring
            - archive_failed
            - restore_failed
          - type: 'null'
        attempt_id:
          anyOf:
          - type: string
          - type: 'null'
        direction:
          anyOf:
          - type: string
            enum:
            - archive
            - restore
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - experiment_id
      - archive_state
      - attempt_id
      - direction
      - reason
      description: Archive/restore state reconciled with live Jobs.
    ClustersResult:
      properties:
        name:
          type: string
        cutoff:
          type: number
        clusters:
          items:
            $ref: '#/components/schemas/ClustersResultClustersItem'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/ClustersResultTransitionsItem'
          type: array
        step:
          type: number
        version:
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      - cutoff
      - clusters
      - transitions
      - step
      - version
      description: Conformational clusters and their transitions.
    ClustersResultClustersItem:
      properties:
        frames:
          items:
            type: integer
          type: array
        main:
          type: integer
      additionalProperties: false
      type: object
      required:
      - frames
      - main
      description: One cluster.
    ClustersResultTransitionsItem:
      properties:
        from:
          type: integer
        to:
          type: integer
        count:
          type: integer
      additionalProperties: false
      type: object
      required:
      - from
      - to
      - count
    CreateExperimentForm:
      properties:
        experiment-name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - pdb
          - repo
          - file
        simulation-files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
        pdb:
          anyOf:
          - type: string
          - type: 'null'
        repo-url:
          anyOf:
          - type: string
          - type: 'null'
        notebooks-repo:
          anyOf:
          - type: string
          - type: 'null'
        access-token:
          anyOf:
          - type: string
          - type: 'null'
        notebook-module:
          anyOf:
          - type: string
          - type: 'null'
        engine:
          $ref: '#/components/schemas/Engine'
