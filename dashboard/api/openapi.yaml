      type: object
      required:
      - experiment-name
      - type
    Engine:
      type: string
      enum:
      - GMX
      - AMBER
      description: Molecular dynamics engine types.
    Experiment:
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        module_name:
          anyOf:
          - type: string
          - type: 'null'
        module_category:
          anyOf:
          - $ref: '#/components/schemas/NotebookModuleCategory'
          - type: 'null'
        latest_simulation_path:
          anyOf:
          - type: string
          - type: 'null'
        source:
          anyOf:
          - $ref: '#/components/schemas/ExperimentSource'
