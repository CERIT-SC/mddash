openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: MDDash Dashboard API
  version: 1.0.0
  description: API for experiment, simulation, compute, analysis, notebook, file, and publication workflows.
servers:
  - url: /
tags:
  - {name: System}
  - {name: Experiments}
  - {name: Simulations}
  - {name: GROMACS}
  - {name: AMBER}
  - {name: Tuner}
  - {name: Analysis}
  - {name: Notebooks}
  - {name: Files}
  - {name: MDRepo}
paths:
  /dash/api/:
    get:
      tags: [System]
      summary: Check API health
      operationId: getApiRoot
      responses:
        '200': {$ref: '#/components/responses/Health'}
  /dash/api/health:
    get:
      tags: [System]
      summary: Check API health
      operationId: getHealth
      responses:
        '200': {$ref: '#/components/responses/Health'}
  /dash/api/notebook-modules:
    get:
      tags: [Notebooks]
      summary: List curated notebook modules
      operationId: listNotebookModules
      responses:
        '200':
          description: Public notebook module catalog
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/NotebookModule'}}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/metrics:
    get:
      tags: [System]
      summary: Get resource usage and limits
      operationId: getMetrics
      responses:
        '200':
          description: Resource metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metrics'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/notebook-config:
    get:
      tags: [Notebooks]
      summary: Get notebook resource configuration
      operationId: getNotebookConfig
      responses:
        '200':
          description: Notebook tiers and default
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotebookConfig'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments:
    get:
      tags: [Experiments]
      summary: List experiments
      operationId: listExperiments
      responses:
        '200':
          description: Experiments
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Experiment'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Experiments]
      summary: Create an experiment
      operationId: createExperiment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CreateExperimentForm'}
      responses:
        '201':
          description: Created experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Experiments]
      summary: Get an experiment
      operationId: getExperiment
      responses:
        '200':
          description: Experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Experiments]
      summary: Update an experiment
      operationId: updateExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateExperiment'}
      responses:
        '200':
          description: Updated experiment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Experiment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Experiments]
      summary: Delete an experiment
      operationId: deleteExperiment
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/publish:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    post:
      tags: [Experiments]
      summary: Publish an experiment
      operationId: publishExperiment
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '201':
          description: MDPosit publication package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MDPositPublication'}
        '202':
          description: MDRepo publication accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MDRepoPublication'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/publish/status:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Experiments]
      summary: Get MDRepo upload status
      operationId: getPublishStatus
      responses:
        '200':
          description: Publication status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/mdrepo/status:
    get:
      tags: [MDRepo]
      summary: Get MDRepo authentication status
      operationId: getMDRepoStatus
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MDRepoStatus'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/mdrepo/auth:
    get:
      tags: [MDRepo]
      summary: Begin MDRepo OAuth authorization
      operationId: authorizeMDRepo
      parameters:
        - name: return_url
          in: query
          schema: {type: string, default: /}
      responses:
        '302': {$ref: '#/components/responses/Redirect'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/mdrepo/callback:
    get:
      tags: [MDRepo]
      summary: Complete MDRepo OAuth authorization
      operationId: completeMDRepoAuthorization
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
        - {name: error_description, in: query, schema: {type: string}}
      responses:
        '302': {$ref: '#/components/responses/Redirect'}
  /dash/api/mdrepo/logout:
    post:
      tags: [MDRepo]
      summary: Clear MDRepo credentials
      operationId: logoutMDRepo
      responses:
        '200':
          description: Logout confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/files:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Files]
      summary: List experiment files
      operationId: listExperimentFiles
      parameters:
        - name: ext
          in: query
          description: Comma-separated file extensions
          schema: {type: string}
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FileInfo'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/files/{path}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/FilePath'}
    get:
      tags: [Files]
      summary: Download an experiment file
      operationId: downloadExperimentFile
      responses:
        '200':
          description: File contents; the actual media type is inferred from the file
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/simulations:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Simulations]
      summary: List simulation manifests
      operationId: listSimulations
      responses:
        '200':
          description: Simulations
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Simulation'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Simulations]
      summary: Create a simulation manifest
      operationId: createSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationWrite'}
      responses:
        '201':
          description: Created simulation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Simulation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/simulations/{simulation_path}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    get:
      tags: [Simulations]
      summary: Get a simulation manifest
      operationId: getSimulation
      responses:
        '200':
          description: Simulation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Simulation'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Simulations]
      summary: Update a simulation manifest
      operationId: updateSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationWrite'}
      responses:
        '200':
          description: Updated simulation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Simulation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Simulations]
      summary: Delete a simulation manifest
      operationId: deleteSimulation
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/gmx:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [GROMACS]
      summary: List GROMACS jobs
      operationId: listGromacsJobs
      responses:
        '200':
          description: GROMACS jobs
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GromacsJob'}}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/gmx/{simulation_path}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    get:
      tags: [GROMACS]
      summary: Get a GROMACS job
      operationId: getGromacsJob
      responses:
        '200':
          description: GROMACS job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GromacsJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [GROMACS]
      summary: Submit a GROMACS job
      operationId: submitGromacsJob
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GromacsJobRequest'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/GromacsJobRequest'}
      responses:
        '201':
          description: Submitted or existing GROMACS job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GromacsJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [GROMACS]
      summary: Delete a GROMACS job
      operationId: deleteGromacsJob
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/gmx/{simulation_path}/log:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    get:
      tags: [GROMACS]
      summary: Get a GROMACS job log
      operationId: getGromacsJobLog
      parameters:
        - {name: type, in: query, schema: {type: string, default: gmx}}
        - {name: tail, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
      responses:
        '200': {$ref: '#/components/responses/TextValue'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/amber:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [AMBER]
      summary: List AMBER jobs
      operationId: listAmberJobs
      responses:
        '200':
          description: AMBER jobs
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AmberJob'}}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/amber/{simulation_path}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    get:
      tags: [AMBER]
      summary: Get an AMBER job
      operationId: getAmberJob
      responses:
        '200':
          description: AMBER job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AmberJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [AMBER]
      summary: Submit an AMBER job
      operationId: submitAmberJob
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AmberJobRequest'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/AmberJobRequest'}
      responses:
        '201':
          description: Submitted or existing AMBER job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AmberJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [AMBER]
      summary: Delete an AMBER job
      operationId: deleteAmberJob
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/amber/{simulation_path}/log:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    get:
      tags: [AMBER]
      summary: Get an AMBER job log
      operationId: getAmberJobLog
      parameters:
        - {name: type, in: query, schema: {type: string, default: mdout}}
        - {name: tail, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
      responses:
        '200': {$ref: '#/components/responses/TextValue'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/tuner:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Tuner]
      summary: List tuner jobs
      operationId: listTunerJobs
      responses:
        '200':
          description: Tuner jobs
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TunerJob'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Tuner]
      summary: Start a tuner job
      operationId: startTunerJob
      parameters:
        - {name: simulation_path, in: query, schema: {type: string}}
        - {name: nsteps, in: query, schema: {type: integer, minimum: 1}}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TunerJobRequest'}
      responses:
        '200':
          description: Existing tuner job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TunerJob'}
        '201':
          description: Started tuner job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TunerJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/tuner/{simulation_path}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    get:
      tags: [Tuner]
      summary: Get a tuner job
      operationId: getTunerJob
      responses:
        '200':
          description: Tuner job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TunerJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Tuner]
      summary: Delete a tuner job
      operationId: deleteTunerJob
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/tuner/{simulation_path}/stop:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
    post:
      tags: [Tuner]
      summary: Stop a tuner job
      operationId: stopTunerJob
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/tuner/{simulation_path}/trials/{trial_id}/stdout:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
      - {$ref: '#/components/parameters/TrialId'}
    get:
      tags: [Tuner]
      summary: Get tuner trial standard output
      operationId: getTunerTrialStdout
      responses:
        '200': {$ref: '#/components/responses/TextValue'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/tuner/{simulation_path}/trials/{trial_id}/stderr:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/SimulationPath'}
      - {$ref: '#/components/parameters/TrialId'}
    get:
      tags: [Tuner]
      summary: Get tuner trial standard error
      operationId: getTunerTrialStderr
      responses:
        '200': {$ref: '#/components/responses/TextValue'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/notebook:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Notebooks]
      summary: Get an experiment notebook
      operationId: getNotebook
      responses:
        '200':
          description: Notebook
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notebook'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Notebooks]
      summary: Start an experiment notebook
      operationId: startNotebook
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartNotebookRequest'}
      responses:
        '201':
          description: Started notebook
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notebook'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Notebooks]
      summary: Stop an experiment notebook
      operationId: stopNotebook
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Analysis]
      summary: List analysis jobs
      operationId: listAnalysisJobs
      parameters:
        - {$ref: '#/components/parameters/SimulationPathQuery'}
      responses:
        '200':
          description: Analysis jobs
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AnalysisJob'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Analysis]
      summary: Submit an analysis job
      operationId: submitAnalysisJob
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalysisJobRequest'}
      responses:
        '201':
          description: Submitted analysis job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis/types:
    get:
      tags: [Analysis]
      summary: List supported analysis types
      description: The hard set of mwf analysis task names derived from the MDDB workflow — the pool of analyses a simulation can produce.
      operationId: listAnalysisTypes
      parameters:
        - {$ref: '#/components/parameters/ExperimentId'}
      responses:
        '200':
          description: Analysis type ids
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis/results:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
    get:
      tags: [Analysis]
      summary: List available analysis results
      operationId: listAnalysisResults
      parameters:
        - {$ref: '#/components/parameters/RequiredSimulationPathQuery'}
      responses:
        '200':
          description: Normalized analysis result names
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis/results/{name}/variants:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/AnalysisResultName'}
    get:
      tags: [Analysis]
      summary: List variants for an analysis result
      operationId: listAnalysisResultVariants
      parameters:
        - {$ref: '#/components/parameters/RequiredSimulationPathQuery'}
      responses:
        '200':
          description: Analysis variants
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AnalysisVariant'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis/results/{name}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/AnalysisResultName'}
    get:
      tags: [Analysis]
      summary: Get a typed analysis result
      operationId: getAnalysisResult
      parameters:
        - {$ref: '#/components/parameters/RequiredSimulationPathQuery'}
      responses:
        '200':
          description: Supported MWF analysis result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis/{job_id}:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [Analysis]
      summary: Get an analysis job
      operationId: getAnalysisJob
      responses:
        '200':
          description: Analysis job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisJob'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Analysis]
      summary: Delete an analysis job
      operationId: deleteAnalysisJob
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dash/api/experiments/{experiment_id}/analysis/{job_id}/logs:
    parameters:
      - {$ref: '#/components/parameters/ExperimentId'}
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [Analysis]
      summary: Get analysis job logs
      operationId: getAnalysisJobLogs
      parameters:
        - {name: tail, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 200}}
      responses:
        '200': {$ref: '#/components/responses/TextValue'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
components:
  parameters:
    ExperimentId: {name: experiment_id, in: path, required: true, schema: {type: string, minLength: 1}}
    SimulationPath: {name: simulation_path, in: path, required: true, schema: {type: string, minLength: 1}}
    FilePath: {name: path, in: path, required: true, schema: {type: string, minLength: 1}}
    TrialId: {name: trial_id, in: path, required: true, schema: {type: string, minLength: 1}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string, minLength: 1}}
    AnalysisResultName: {name: name, in: path, required: true, schema: {type: string, minLength: 1}}
    SimulationPathQuery: {name: simulation_path, in: query, schema: {type: string, minLength: 1}}
    RequiredSimulationPathQuery: {name: simulation_path, in: query, required: true, schema: {type: string, minLength: 1}}
  responses:
    Health:
      description: API is running
      content:
        application/json:
          schema: {type: string, const: API is up!}
    TextValue:
      description: Text represented as a JSON string
      content:
        application/json:
          schema: {type: string}
    NoContent: {description: Operation completed successfully}
    Redirect:
      description: Redirect
      headers:
        Location: {required: true, schema: {type: string}}
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Operation forbidden
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableEntity:
      description: Resource could not be processed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. The HTTP status is carried by the response status line.
      required: [type, title, detail]
      properties:
        type: {type: string, format: uri, pattern: '^urn:mddash:'}
        title: {type: string, minLength: 1}
        detail: {type: string, minLength: 1}
        solution: {type: string, minLength: 1}
      additionalProperties: false
    Engine: {type: string, enum: [GMX, AMBER]}
    JobStatus: {type: string, enum: [UNKNOWN, PENDING, RUNNING, FINISHED, ERROR]}
    PodStatus: {type: string, enum: [UNKNOWN, PENDING, RUNNING, ERROR, DOWN, TERMINATING, TERMINATED]}
    NullableString: {type: [string, 'null']}
    Message:
      type: object
      required: [message]
      properties: {message: {type: string}}
      additionalProperties: false
    NotebookModuleIcon: {type: string, enum: [protein, membrane]}
    NotebookModule:
      type: object
      required: [id, name, engine, author, icon]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        engine: {$ref: '#/components/schemas/Engine'}
        author: {type: string}
        icon: {$ref: '#/components/schemas/NotebookModuleIcon'}
      additionalProperties: false
    Metrics:
      type: object
      required: [storage_used_bytes, storage_limit_bytes, uptime_seconds]
      properties:
        storage_used_bytes: {type: [integer, 'null'], description: Bytes used; null until the du monitor records a measurement}
        storage_limit_bytes: {type: [integer, 'null'], description: Configured storage quota in bytes}
        uptime_seconds: {type: integer}
      additionalProperties: false
    NotebookTier:
      type: object
      required: [value, cpuLimit, memoryLimit]
      properties:
        value: {type: string, enum: [1x, 2x, 4x]}
        cpuLimit: {type: string}
        memoryLimit: {type: string}
      additionalProperties: false
    NotebookConfig:
      type: object
      required: [tiers, defaultTier, concurrentLimit]
      properties:
        tiers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/NotebookTier'}}
        defaultTier: {type: string, enum: [1x, 2x, 4x]}
        concurrentLimit: {type: integer, minimum: 1, description: Max concurrent notebook pods per user namespace}
      additionalProperties: false
    Notebook:
      type: object
      required: [id, experiment_id, token, gpu, path, status, started_at]
      properties:
        id: {type: integer}
        experiment_id: {type: string}
        token: {type: string}
        tier: {type: [string, 'null'], enum: [1x, 2x, 4x, null]}
        gpu: {type: boolean}
        path: {type: string}
        status: {$ref: '#/components/schemas/PodStatus'}
        started_at: {type: [string, 'null'], format: date-time, description: Pod start time; null while the pod is absent}
      additionalProperties: false
    Experiment:
      type: object
      required: [id, created_at, updated_at, name, engine, latest_simulation_path, notebook, tuner_jobs, simulation_jobs, analysis_jobs]
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        name: {type: string}
        module_name: {$ref: '#/components/schemas/NullableString'}
        # Manifest path of the most recently active simulation; the experiment's
        # step/status and dashboard detail rows always inherit from it.
        latest_simulation_path: {type: [string, 'null']}
        source:
          oneOf:
            - {$ref: '#/components/schemas/ExperimentSource'}
            - {type: 'null'}
        size_bytes: {type: [integer, 'null']}
        notebooks_repo: {$ref: '#/components/schemas/NullableString'}
        mdrepo_id: {$ref: '#/components/schemas/NullableString'}
        mdrepo_published: {type: [boolean, 'null']}
        engine: {$ref: '#/components/schemas/Engine'}
        notebook:
          oneOf:
            - {$ref: '#/components/schemas/Notebook'}
            - {type: 'null'}
        tuner_jobs: {type: array, items: {$ref: '#/components/schemas/TunerJob'}}
        simulation_jobs: {type: array, items: {$ref: '#/components/schemas/SimulationJob'}}
        analysis_jobs: {type: array, items: {$ref: '#/components/schemas/AnalysisJob'}}
        step: {type: integer}
        status: {type: string}
        # Publishing is experiment-level: true once a draft exists or any run finished.
        can_publish: {type: boolean}
        mdrepo_record_url: {$ref: '#/components/schemas/NullableString'}
      additionalProperties: false
    CreateExperimentForm:
      type: object
      required: [experiment-name, type]
      properties:
        experiment-name: {type: string, minLength: 1}
        type: {type: string, enum: [pdb, repo, file]}
        pdb: {type: string}
        repo-url: {type: string}
        notebooks-repo: {type: string}
        access-token: {type: string}
        notebook-module: {type: string}
        engine: {$ref: '#/components/schemas/Engine'}
        simulation-files: {type: array, items: {type: string, contentMediaType: application/octet-stream}}
      additionalProperties: false
    UpdateExperiment:
      type: object
      required: [name]
      properties: {name: {type: string}}
      additionalProperties: false
    ExperimentSource:
      type: object
      required: [type, files]
      properties:
        type: {type: string, enum: [pdb, repo, file]}
        pdb_id: {type: string}
        url: {type: string}
        files: {type: array, items: {$ref: '#/components/schemas/FileInfo'}}
        file_count: {type: integer, minimum: 0}
      additionalProperties: false
    FileInfo:
      type: object
      required: [name, size, path, url]
      properties:
        name: {type: string}
        size: {type: integer, minimum: 0}
        path: {type: string}
        url: {type: string}
      additionalProperties: false
    SimulationFiles:
      type: object
      additionalProperties: {type: string, minLength: 1}
    SimulationWrite:
      type: object
      required: [name, files]
      properties:
        simulation_path: {type: string}
        name: {type: string, minLength: 1}
        engine: {$ref: '#/components/schemas/Engine'}
        files: {$ref: '#/components/schemas/SimulationFiles'}
        extra_args: {type: string, default: ''}
      additionalProperties: false
    Simulation:
      type: object
      required: [simulation_path, name, engine, files, resolved_files, extra_args, locked, valid, errors, missing_files, step, status, live, last_activity]
      properties:
        simulation_path: {type: string}
        name: {type: string}
        engine: {type: string}
        files: {$ref: '#/components/schemas/SimulationFiles'}
        resolved_files: {$ref: '#/components/schemas/SimulationFiles'}
        extra_args: {type: string}
        locked: {type: boolean}
        valid: {type: boolean}
        errors: {type: array, items: {type: string}}
        missing_files: {type: array, items: {type: string}}
        # Wizard phase index (Setup 0, Tune 1, Run 2, Analyze 3); publish is experiment-level.
        step: {type: integer, minimum: 0, maximum: 3}
        status: {type: string}
        # True while any tuner or production job for this simulation may still advance on its own.
        live: {type: boolean}
        last_activity: {type: number}
      additionalProperties: false
    SimulationJob:
      type: object
      required: [id, experiment_id, simulation_path, created_at, engine, np, ntomp, status, is_live]
      properties:
        id: {type: string}
        experiment_id: {type: string}
        simulation_path: {type: string}
        created_at: {type: string, format: date-time}
        engine: {$ref: '#/components/schemas/Engine'}
        np: {type: integer, minimum: 1}
        ntomp: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/JobStatus'}
        start_timestamp: {type: [integer, 'null']}
        finish_timestamp: {type: [integer, 'null']}
        nsteps: {type: [integer, 'null']}
        nsteps_done: {type: [integer, 'null'], description: Steps completed so far (parsed from the engine log)}
        performance: {type: [number, 'null']}
        estimated_time: {type: [integer, 'null'], description: Estimated seconds until completion}
        # True while the job's status is non-terminal; auto-emitted with every job payload.
        is_live: {type: boolean}
        log_lines:
          type: object
          description: Line counts per log stream for sizing badges without fetching logs; null while a stream's file does not exist yet
          additionalProperties: false
          properties:
            gmx: {type: [integer, 'null'], description: Engine log (GROMACS only)}
            mdout: {type: [integer, 'null'], description: Engine log (AMBER only)}
            stdout: {type: [integer, 'null']}
            stderr: {type: [integer, 'null']}
      additionalProperties: true
    GromacsJob:
      allOf:
        - {$ref: '#/components/schemas/SimulationJob'}
        # pme/nb are non-nullable columns — every stored job carries them.
        - type: object
          required: [pme, nb]
          properties:
            pme: {type: string, enum: [cpu, gpu]}
            nb: {type: string, enum: [cpu, gpu]}
    AmberJob:
      allOf:
        - {$ref: '#/components/schemas/SimulationJob'}
        # binary/ewald are non-nullable columns — every stored job carries them.
        - type: object
          required: [binary, ewald]
          properties:
            binary: {type: string}
            ewald: {type: string}
    GromacsJobRequest:
      type: object
      required: [np, ntomp, pme, nb]
      properties:
        np: {type: integer, minimum: 1}
        ntomp: {type: integer, minimum: 1}
        pme: {type: string, enum: [cpu, gpu]}
        nb: {type: string, enum: [cpu, gpu]}
      additionalProperties: false
    AmberJobRequest:
      type: object
      required: [binary, ewald, np, ntomp]
      properties:
        binary: {type: string}
        ewald: {type: string}
        np: {type: integer, minimum: 1}
        ntomp: {type: integer, minimum: 1}
      additionalProperties: false
    TunerTrial:
      type: object
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/JobStatus'}
        performance: {type: [number, 'null']}
      additionalProperties: true
    TunerJob:
      type: object
      required: [id, experiment_id, simulation_path, created_at, nsteps, is_stopped, engine, tuner_status, trials, is_live]
      properties:
        id: {type: string}
        experiment_id: {type: string}
        simulation_path: {type: string}
        nsteps: {type: integer}
        error_message: {$ref: '#/components/schemas/NullableString'}
        created_at: {type: string, format: date-time}
        is_stopped: {type: boolean}
        engine: {$ref: '#/components/schemas/Engine'}
        tuner_status: {$ref: '#/components/schemas/JobStatus'}
        # True while the tuner job is not stopped and its status is non-terminal.
        is_live: {type: boolean}
        sim_length_ns: {type: [number, 'null']}
        trials: {type: array, items: {$ref: '#/components/schemas/TunerTrial'}}
      additionalProperties: false
    TunerJobRequest:
      type: object
      required: [simulation_path, nsteps]
      properties:
        simulation_path: {type: string, minLength: 1}
        nsteps: {type: integer, minimum: 1}
      additionalProperties: false
    AnalysisJob:
      type: object
      required: [id, experiment_id, simulation_path, analysis_name, created_at, status]
      properties:
        id: {type: string}
        experiment_id: {type: string}
        simulation_path: {type: string}
        analysis_name:
          type: string
          enum: [apl, clusters, density, dist, energies, hbonds, inter, linter, lorder, pairwise, pca, perres, pockets, rgyr, rmsds, rmsf, sas, thickness, tmscore]
        created_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/JobStatus'}
        sim_progress:
          type: number
          nullable: true
          description: Fraction (0-1) of the simulation's steps available when the analysis inputs were snapshotted; null when unknown.
      additionalProperties: true
    AnalysisJobRequest:
      type: object
      required: [simulation_path, analysis]
      properties:
        simulation_path: {type: string, minLength: 1}
        analysis: {type: string, enum: [apl, clusters, density, dist, energies, hbonds, inter, linter, lorder, pairwise, pca, perres, pockets, rgyr, rmsds, rmsf, sas, thickness, tmscore]}
        preprocessing_mode: {type: string, enum: [as_is, image, image_fit], default: as_is}
      additionalProperties: false
    StartNotebookRequest:
      type: object
      properties:
        tier: {type: string, enum: [1x, 2x, 4x]}
        gpu: {type: boolean, default: false}
      additionalProperties: false
    PublishRequest:
      type: object
      properties:
        target: {type: string, enum: [invenio, mdposit], default: invenio}
        simulation_path: {type: [string, 'null']}
      additionalProperties: false
    MDRepoPublication:
      type: object
      required: [id, links, upload_id, upload_state, draft_url]
      properties:
        id: {type: string}
        links: {type: object, additionalProperties: {type: string}}
        upload_id: {type: string}
        upload_state: {type: string}
        draft_url: {$ref: '#/components/schemas/NullableString'}
      additionalProperties: false
    PublicationFile:
      type: object
      required: [path, url]
      properties:
        role: {type: string}
        path: {type: string}
        url: {type: string}
      additionalProperties: false
    MDPositPublication:
      type: object
      required: [metadata_file, files, vre_lite_url]
      properties:
        metadata_file: {$ref: '#/components/schemas/PublicationFile'}
        files: {type: array, items: {$ref: '#/components/schemas/PublicationFile'}}
        vre_lite_url: {$ref: '#/components/schemas/NullableString'}
      additionalProperties: false
    PublishStatus:
      type: object
      required: [experiment_id, mdrepo_id, draft_url, upload_state, reason, total_files, completed_files, total_bytes, completed_bytes]
      properties:
        experiment_id: {type: string}
        mdrepo_id: {$ref: '#/components/schemas/NullableString'}
        draft_url: {$ref: '#/components/schemas/NullableString'}
        upload_state: {type: [string, 'null']}
        reason: {$ref: '#/components/schemas/NullableString'}
        total_files: {type: integer, minimum: 0}
        completed_files: {type: integer, minimum: 0}
        total_bytes: {type: integer, minimum: 0}
        completed_bytes: {type: integer, minimum: 0}
        current_file: {$ref: '#/components/schemas/NullableString'}
        error: {$ref: '#/components/schemas/NullableString'}
        upload_attempt_id: {type: string}
        failed_files: {type: array, items: {$ref: '#/components/schemas/FailedUploadFile'}}
      additionalProperties: true
    FailedUploadFile:
      type: object
      required: [key, error]
      properties:
        key: {type: string}
        error: {type: string}
      additionalProperties: true
    MDRepoStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
        mdrepo_url: {type: string}
      additionalProperties: false
    AnalysisVariant:
      type: object
      required: [analysis, name]
      properties:
        analysis: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
      additionalProperties: true
    NumberMatrix: {type: array, items: {type: array, items: {type: number}}}
    BooleanMatrix: {type: array, items: {type: array, items: {type: boolean}}}
    StatisticalData:
      type: object
      required: [average, stddev, min, max, data]
      properties:
        average: {type: number}
        stddev: {type: number}
        min: {type: number}
        max: {type: number}
        data: {type: array, items: {type: number}}
      additionalProperties: false
    StatisticalSeriesResult:
      type: object
      required: [step, y]
      properties:
        start: {type: number}
        step: {type: number}
        y:
          type: object
          minProperties: 1
          additionalProperties: {$ref: '#/components/schemas/StatisticalData'}
      additionalProperties: false
    NamedSeriesResult:
      type: object
      required: [start, step, data]
      properties:
        start: {type: number}
        step: {type: number}
        data:
          type: array
          items:
            type: object
            required: [reference, group, values]
            properties:
              reference: {type: string}
              group: {type: string}
              values: {type: array, items: {type: number}}
            additionalProperties: false
      additionalProperties: false
    NamedDataResult:
      type: object
      required: [data]
      properties:
        step: {type: number}
        data:
          type: array
          items:
            type: object
            required: [name]
            properties: {name: {type: string}}
            additionalProperties: true
      additionalProperties: false
    MatrixResult:
      type: object
      properties:
        start: {type: number}
        step: {type: number}
        rmsdpr: {$ref: '#/components/schemas/NumberMatrix'}
        saspf:
          type: array
          items: {type: array, items: {type: [number, 'null']}}
        means: {type: array, items: {type: number}}
        stdvs: {type: array, items: {type: number}}
      anyOf: [{required: [rmsdpr]}, {required: [saspf]}]
      additionalProperties: false
    PCAResult:
      type: object
      required: [framestep, atoms, eigenvalues, projections]
      properties:
        framestep: {type: number}
        atoms: {type: array, items: {type: integer}}
        eigenvalues: {type: array, items: {type: number}}
        projections: {$ref: '#/components/schemas/NumberMatrix'}
      additionalProperties: false
    ClustersResult:
      type: object
      required: [name, cutoff, clusters, transitions, step, version]
      properties:
        name: {type: string}
        cutoff: {type: number}
        clusters:
          type: array
          items:
            type: object
            required: [frames, main]
            properties:
              frames: {type: array, items: {type: integer}}
              main: {type: integer}
            additionalProperties: false
        transitions:
          type: array
          items:
            type: object
            required: [from, to, count]
            properties:
              from: {type: integer}
              to: {type: integer}
              count: {type: integer}
            additionalProperties: false
        step: {type: number}
        version: {type: string}
      additionalProperties: false
    MembraneMapResult:
      type: object
      required: [n_mems, mems, no_mem_lipid]
      properties:
        n_mems: {type: integer}
        mems: {type: object, additionalProperties: {type: object}}
        no_mem_lipid: {type: array, items: {type: integer}}
      additionalProperties: false
    ThicknessResult:
      type: object
      required: [data]
      properties:
        step: {type: number}
        data:
          type: object
          required: [frame, mean_positive, mean_negative, std_positive, std_negative, thickness, std_thickness, midplane_z]
          additionalProperties: {type: array, items: {type: number}}
      additionalProperties: false
    InteractionResult:
      type: object
      required: [name, agent_1, agent_2]
      properties:
        name: {type: string}
        agent_1: {type: string}
        agent_2: {type: string}
        has_cg: {type: boolean}
        version: {type: string}
      additionalProperties: true
    AnalysisResult:
      description: Closed catalog of analysis result shapes currently supported by the dashboard.
      oneOf:
        - {$ref: '#/components/schemas/StatisticalSeriesResult'}
        - {$ref: '#/components/schemas/NamedSeriesResult'}
        - {$ref: '#/components/schemas/NamedDataResult'}
        - {$ref: '#/components/schemas/MatrixResult'}
        - {$ref: '#/components/schemas/PCAResult'}
        - {$ref: '#/components/schemas/ClustersResult'}
        - {$ref: '#/components/schemas/MembraneMapResult'}
        - {$ref: '#/components/schemas/ThicknessResult'}
        - {$ref: '#/components/schemas/InteractionResult'}
