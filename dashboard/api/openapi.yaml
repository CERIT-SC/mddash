        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
        notebooks_repo:
          anyOf:
          - type: string
          - type: 'null'
        mdrepo_id:
          anyOf:
          - type: string
          - type: 'null'
        mdrepo_published:
          anyOf:
          - type: boolean
          - type: 'null'
        engine:
          $ref: '#/components/schemas/Engine'
        notebook:
          anyOf:
          - $ref: '#/components/schemas/Notebook'
          - type: 'null'
        tuner_jobs:
          items:
            $ref: '#/components/schemas/TunerJob'
          type: array
        simulation_jobs:
          items:
            $ref: '#/components/schemas/SimulationJob'
