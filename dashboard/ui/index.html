<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FAIR MD Dash - Molecular Dynamics Simulation Dashboard for managing and analyzing GROMACS simulations" />
    <meta name="keywords" content="molecular dynamics, GROMACS, simulation, protein, JupyterHub, dashboard" />
    <title>FAIR MD Dash</title>
    <!-- Dynamically set base href for proper asset resolution in nested routes -->
    <script>
      (function() {
        var path = window.location.pathname;
        var dashIndex = path.indexOf('/dash/');
        var base = document.createElement('base');
        if (dashIndex !== -1) {
          base.href = path.substring(0, dashIndex + 6);
        } else {
          base.href = '/';
        }
        document.head.appendChild(base);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config injected by Caddy - will 404 in dev mode which is fine -->
    <script src="config.js"></script>
    <script type="module" src="src/Main.tsx"></script>
  </body>
</html>
