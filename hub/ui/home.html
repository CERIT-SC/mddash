<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Home · MDDash</title>
    <script>
      window.appConfig = {
        baseUrl: {{ base_url | tojson }},
        userName: {{ user.name | tojson }},
        xsrf: {{ xsrf_token | tojson }},
        logoutUrl: {{ logout_url | tojson }},
        adminAccess: {{ admin_access | tojson }},
        {% if announcement_home is string %}
        announcement: {{ announcement_home | tojson }},
        {% else %}
        announcement: {{ announcement | default(none) | tojson }},
        {% endif %}
        defaultServerActive: {{ default_server.active | tojson }},
        serverUrl: {{ url | tojson }}
      };
    </script>
  </head>
  <body>
    <noscript>
      <p>JupyterHub requires JavaScript. Please enable it to proceed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/home.tsx"></script>
  </body>
</html>
