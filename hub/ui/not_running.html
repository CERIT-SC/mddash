<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://preview.talqo.chat; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://preview.talqo.chat; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Server not running · MDDash</title>
    <script>
      window.appConfig = {
        baseUrl: {{ base_url | default("") | tojson }},
        userName: {{ user.name | tojson }},
        logoutUrl: {{ logout_url | default("") | tojson }},
        adminAccess: {{ admin_access | default(user.admin) | default(false) | tojson }},
        announcement: {{ announcement | default(none) | tojson }},
        failed: {{ failed | default(false) | tojson }},
        serverName: {{ server_name | default("") | tojson }},
        spawnUrl: {{ spawn_url | default("") | tojson }},
        failedMessage: {{ failed_message | default(none) | tojson }},
        failedHtmlMessage: {{ failed_html_message | default(none) | tojson }},
        implicitSpawnSeconds: {{ implicit_spawn_seconds | default(0) | tojson }}
      };
    </script>
  </head>
  <body>
    <noscript>
      <p>JupyterHub requires JavaScript. Please enable it to proceed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/not_running.tsx"></script>
    <script
      async
      src="https://preview.talqo.chat/widget.js"
      data-talqo-embed-token="IZeaJR7LDQ85F84H2RZMuXjIlpWW_woO02h5dZdJNoc"
    ></script>
  </body>
</html>
