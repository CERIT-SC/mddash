<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://talqo.chat; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://talqo.chat; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Error · MDDash</title>
    <script>
      window.appConfig = {
        baseUrl: {{ base_url | default("") | tojson }},
        statusCode: {{ status_code | default(500) | tojson }},
        statusMessage: {{ status_message | default("Error") | tojson }},
        message: {{ message | default(none) | tojson }},
        messageHtml: {{ message_html | default(none) | tojson }},
        extraErrorHtml: {{ extra_error_html | default(none) | tojson }},
        announcement: {{ announcement | default(none) | tojson }}
      };
    </script>
  </head>
  <body>
    <noscript>
      <p>JupyterHub requires JavaScript. Please enable it to proceed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/error.tsx"></script>
    <script>
      window.__TALQO__ = {
        "token": "75ec5a0f-9e2a-45b5-97b4-c8eaa7d48aed"
      };
    </script>
    <script async defer src="https://talqo.chat/widget-bundle.js"></script>
  </body>
</html>
