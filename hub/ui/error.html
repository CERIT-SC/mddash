<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Error · MDDash</title>
    <script>
      window.appConfig = {
        baseUrl: {{ base_url | tojson }},
        statusCode: {{ status_code | tojson }},
        statusMessage: {{ status_message | tojson }},
        message: {{ message | default(none) | tojson }},
        messageHtml: {{ message_html | default(none) | tojson }},
        extraErrorHtml: {{ extra_error_html | default(none) | tojson }},
        announcement: {{ announcement | default(none) | tojson }}
      };
    </script>
  </head>
  <body>
    <noscript>
      <p>JupyterHub requires JavaScript. Please enable it to proceed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/error.tsx"></script>
  </body>
</html>
