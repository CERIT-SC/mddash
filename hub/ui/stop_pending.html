<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Server stopping · MDDash</title>
    <script>
      window.appConfig = {
        baseUrl: {{ base_url | default("") | tojson }},
        userName: {{ user.name | tojson }},
        xsrf: {{ xsrf_token | default("") | tojson }},
        logoutUrl: {{ logout_url | default("") | tojson }},
        adminAccess: {{ admin_access | default(user.admin) | default(false) | tojson }},
        announcement: {{ announcement | default(none) | tojson }}
      };
    </script>
  </head>
  <body>
    <noscript>
      <p>JupyterHub requires JavaScript. Please enable it to proceed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/stop_pending.tsx"></script>
  </body>
</html>
