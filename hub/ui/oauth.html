<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Authorize access · MDDash</title>
    <script>
      window.appConfig = {
        baseUrl: {{ base_url | tojson }},
        xsrf: {{ xsrf | tojson }},
        clientDescription: {{ oauth_client.description | default("") | tojson }},
        redirectUri: {{ oauth_client.redirect_uri | default("") | tojson }},
        allowedScopes: {{ allowed_scopes | tojson }},
        scopeDescriptions: {{ scope_descriptions | tojson }}
      };
    </script>
  </head>
  <body>
    <noscript>
      <p>JupyterHub requires JavaScript. Please enable it to proceed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/pages/oauth.tsx"></script>
  </body>
</html>
